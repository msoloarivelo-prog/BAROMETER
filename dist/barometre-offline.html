.gantt-sub { display: block; color: var(--muted); font-size: .7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-track {
  grid-column: 2 / -1;
  display: grid;
  grid-template-columns: repeat(var(--months), 1fr);
  height: 100%;
  align-items: center;
  background-image: linear-gradient(to right, var(--border) 1px, transparent 1px);
  background-size: calc(100% / var(--months)) 100%;
}
.gantt-bar { height: 14px; border-radius: 4px; background: var(--c-other); margin: 0 2px; }
.cat-maintain .gantt-bar { background: var(--c-maintain); }
.cat-opportunity .gantt-bar { background: var(--c-opportunity); }
.cat-address .gantt-bar { background: var(--c-address); }
.status-done .gantt-bar { background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .35) 0 4px, transparent 4px 8px); }
.status-done .gantt-title::after { content: " ✓"; color: var(--ok); }

/* ------------------------------------------------------------ facilitator */

.portfolio td { font-size: .9rem; }
.heat { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.heat-1 { background: var(--l1-bg); color: var(--l1); }
.heat-2 { background: var(--l2-bg); color: #b46d00; }
.heat-3 { background: var(--l3-bg); color: #4f7d1c; }
.heat-4 { background: var(--l4-bg); color: var(--l4); }
.heat-none { color: var(--muted); }
.fac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.fac-grid .card { margin-bottom: 1rem; }
.method { border: 0; padding: 0; margin: 0 0 .8rem; display: grid; gap: .4rem; }
.method legend { font-weight: 600; margin-bottom: .3rem; }
.weights input { width: 5rem; }
.dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .5rem; vertical-align: middle; }

/* ------------------------------------------------------------ evolution */

.evo-summary { grid-template-columns: repeat(4, 1fr); }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.segmented button { border: 0; background: var(--surface); color: var(--text); padding: .45rem .8rem; font: inherit; font-size: .9rem; cursor: pointer; }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button.active { background: var(--accent); color: var(--accent-text); }
.evo-selectors { display: flex; flex-wrap: wrap; gap: .6rem 1rem; margin-bottom: .6rem; }
.evo-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; margin-bottom: .6rem; }
.evo-kpi { border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem; display: flex; flex-direction: column; }
.evo-kpi strong { font-size: 1.6rem; line-height: 1.1; }
.evo-kpi span { font-size: .8rem; color: var(--muted); }
.evo-kpi.up strong { color: var(--ok); }
.evo-kpi.down strong { color: var(--danger); }
.evo-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: .6rem; }
.evo-list h3 { margin: .4rem 0; display: flex; gap: .5rem; align-items: baseline; }
.evo-list.up h3 { color: var(--ok); }
.evo-list.down h3 { color: var(--danger); }
.evo-list .level-badge { min-width: 1.35rem; height: 1.35rem; font-size: .75rem; }
.period-table td, .period-table th { white-space: nowrap; }
.period-table td:first-child { white-space: normal; }
.done-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; }
.lines-wrap { width: 100%; }
.chart-lines { width: 100%; height: auto; display: block; }
.chart-lines .grid { stroke: var(--border); stroke-width: 1; }
.chart-lines .axis { fill: var(--muted); font-size: 12px; }
.chart-lines .point-value { font-size: 12px; font-weight: 700; }
.chart-legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: .85rem; margin-top: .3rem; }
.chart-legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: .4rem; vertical-align: middle; }
.report .evo-kpi strong { font-size: 15pt; }
.report .evo-kpis { gap: 2mm; }
.report .evo-columns { gap: 4mm; }
.report .evo-list h3 { font-size: 10.5pt; }
.report .chart-lines .axis { font-size: 11px; }

/* ------------------------------------------------------------ report (screen = A4 preview) */

.report { display: grid; gap: 1.5rem; justify-content: center; }
.report-page {
  width: 210mm;
  min-height: 297mm;
  padding: 16mm 15mm;
  background: #fff;
  color: #1d2733;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
  font-size: 10.5pt;
  line-height: 1.45;
  --muted: #5d6b7a;
  --border: #d8dfe6;
  --surface: #fff;
  --surface-2: #eef2f5;
  --text: #1d2733;
}
.report-page .muted { color: #5d6b7a; }
.report-cover { padding-bottom: 6mm; margin-bottom: 6mm; border-bottom: 3px solid var(--accent); }
.report-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 8.5pt; color: var(--accent); font-weight: 700; }
.report-cover h1 { font-size: 21pt; margin: .2rem 0 .4rem; }
.report-org { font-size: 15pt; font-weight: 600; }
.report-org span { color: #5d6b7a; font-weight: 400; }
.report-facts { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: .3rem 2rem; margin: .8rem 0 0; }
.report-facts dt { font-size: 8pt; text-transform: uppercase; color: #5d6b7a; letter-spacing: .04em; }
.report-facts dd { margin: 0; font-weight: 600; }
.report-h { font-size: 13pt; margin: 0 0 .6rem; }
.report-h3 { font-size: 11.5pt; margin: 1.1rem 0 .5rem; padding-bottom: .2rem; border-bottom: 1px solid #d8dfe6; }
.report-h3.pillar { border-bottom: 2px solid var(--pillar); display: flex; justify-content: space-between; }
.report-h3.cat-maintain { color: var(--c-maintain); }
.report-h3.cat-opportunity { color: var(--c-opportunity); }
.report-h3.cat-address { color: var(--c-address); }
.report-kpis { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 4mm; }
.report-kpi { border: 1px solid #d8dfe6; border-radius: 8px; padding: 3mm 4mm; display: flex; flex-direction: column; gap: .1rem; }
.report-kpi span { font-size: 8pt; text-transform: uppercase; color: #5d6b7a; letter-spacing: .04em; }
.report-kpi strong { font-size: 20pt; line-height: 1.1; }
.report-kpi strong small { font-size: 10pt; color: #5d6b7a; font-weight: 500; }
.report-kpi em { font-style: normal; font-size: 9pt; color: #5d6b7a; }
.report-kpi.main { background: #f4f8fb; border-color: var(--accent); }
.report-kpi .delta { margin-left: 0; }
.report-lead { margin: 4mm 0; font-size: 11pt; }
.report-donuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; text-align: center; }
.report-donut { color: var(--pillar); }
.report-donut span { display: block; color: #1d2733; font-weight: 600; font-size: 9.5pt; margin-top: .2rem; }
.report-swot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
.report-swot-col { border-radius: 8px; padding: 3mm; border-top: 3px solid; }
.report-swot-col.cat-maintain { background: #f2f9f5; border-top-color: var(--c-maintain); }
.report-swot-col.cat-opportunity { background: #f1f6fb; border-top-color: var(--c-opportunity); }
.report-swot-col.cat-address { background: #fcf2f2; border-top-color: var(--c-address); }
.report-swot-col h4 { margin: 0 0 .4rem; font-size: 10pt; display: flex; justify-content: space-between; }
.report-top { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; font-size: 9.5pt; }
.report-top li { display: grid; grid-template-columns: auto 1fr; gap: .35rem; align-items: start; }
.report-top li small { display: block; color: #5d6b7a; font-size: 7.5pt; }
.report-top li.muted { display: block; }
.report-gantt-title { break-before: page; }
.report-top .level-badge { min-width: 1.25rem; height: 1.25rem; font-size: 7.5pt; }
.report-plan-counts { display: flex; flex-wrap: wrap; gap: .4rem; }
.report-pillar-bars { margin-bottom: 2mm; }

.report-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
.report-table th, .report-table td { border-bottom: 1px solid #e3e8ed; padding: 1.6mm 2mm; text-align: left; vertical-align: top; }
.report-table th { font-size: 7.5pt; text-transform: uppercase; color: #5d6b7a; letter-spacing: .04em; background: #f6f8fa; }
.report-table .aspect-cell { background: #fafbfc; width: 30%; }
.report-table .level-badge { min-width: 1.35rem; height: 1.35rem; font-size: 8pt; }
.report-table tr.total td { font-weight: 700; border-top: 2px solid #d8dfe6; }
.report-table.compact td { padding: 1.2mm 2mm; }
.plan-table td:first-child { width: 22%; }
.plan-table td:nth-child(2) { width: 34%; }
.cat-dot { font-size: 8pt; }
.cat-dot.cat-maintain { color: var(--c-maintain); }
.cat-dot.cat-opportunity { color: var(--c-opportunity); }
.cat-dot.cat-address { color: var(--c-address); }
.cat-dot.cat-other { color: var(--c-other); }
.own-mark { display: inline-block; font-size: 7.5pt; color: var(--c-other); border: 1px solid var(--c-other); border-radius: 999px; padding: 0 .35rem; }
.report-items { display: grid; gap: 2.5mm; }
.report-item { border-left: 3px solid; padding: 1mm 0 1mm 3mm; break-inside: avoid; }
.report-item.cat-maintain { border-left-color: var(--c-maintain); }
.report-item.cat-opportunity { border-left-color: var(--c-opportunity); }
.report-item.cat-address { border-left-color: var(--c-address); }
.report-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.report-item p { margin: .15rem 0; font-size: 9.5pt; }
.report-item em { color: #5d6b7a; }
.report-item .level-badge { min-width: 1.3rem; height: 1.3rem; font-size: 8pt; }
.report-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; border-bottom: 2px solid var(--accent); padding-bottom: 2mm; margin-bottom: 4mm; }
.report-header h2 { margin: .1rem 0 0; font-size: 15pt; }
.report-meta { text-align: right; font-size: 8.5pt; color: #5d6b7a; }
.report .gantt-chart { --name-w: 50mm; min-width: 0; font-size: 7.5pt; }
.report .gantt-month { font-size: 6pt; }
.report .gantt-year { font-size: 7pt; padding: .5mm 0; }
.report .gantt-line { min-height: 6mm; break-inside: avoid; }
.report .gantt-bar { height: 3mm; }
.signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 12mm; margin-top: 12mm; }
.signature span { font-weight: 600; }
.sig-line { border-bottom: 1px solid #1d2733; height: 22mm; }
.signature small { color: #5d6b7a; }

/* ------------------------------------------------------------ responsive */

@media (max-width: 1000px) {
  .activity-grid { grid-template-columns: 1fr 1fr 1fr; }
  .activity-grid .field:first-child { grid-column: 1 / -1; }
}

@media (max-width: 900px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .fac-summary, .evo-summary { grid-template-columns: 1fr 1fr; }
  .evo-kpis { grid-template-columns: repeat(3, 1fr); }
  .evo-columns { grid-template-columns: 1fr; }
  .kpi-wide { grid-column: 1 / -1; }
  .pillar-grid, .swot-grid, .fac-grid { grid-template-columns: 1fr; }
  .levels { grid-template-columns: repeat(2, 1fr); }
  .level-header { display: none; }
  .main-nav a.nav-facilitator { margin-left: 0; }
  .report { display: block; }
  .report-page { width: auto; min-height: 0; padding: 6mm 5mm; margin-bottom: 1rem; overflow-x: auto; }
}

@media (max-width: 600px) {
  .app-header { position: static; }
  .context-switch { flex: 1 1 100%; width: 100%; min-width: 0; order: 3; }
  .context-switch label { flex: 1 1 140px; min-width: 0; }
  .context-switch select { min-width: 0; max-width: 100%; width: 100%; }
  .context-switch .btn { flex: 1 1 100%; justify-content: center; }
  .inline-field { flex-wrap: wrap; max-width: 100%; }
  .inline-field select { min-width: 0; max-width: 100%; }
  .summary, .fac-summary, .evo-summary { grid-template-columns: 1fr; }
  .evo-kpis { grid-template-columns: 1fr 1fr; }
  .levels { grid-template-columns: 1fr; }
  .pillar-body { flex-direction: column; align-items: stretch; }
  .donut-slot { align-self: center; }
  .activity-grid, .activity-more .activity-grid { grid-template-columns: 1fr 1fr; }
  .report-kpis, .report-swot { grid-template-columns: 1fr; }
  .report-donuts { grid-template-columns: 1fr 1fr; }
  .report-facts { grid-template-columns: 1fr 1fr; }
  .gantt-chart { --name-w: 140px; }
}

/* ------------------------------------------------------------ print / PDF */

@page { size: A4; margin: 12mm; }

@media print {
  :root { --surface: #fff; --surface-2: #eef2f5; --text: #1d2733; --muted: #5d6b7a; --border: #d8dfe6; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .app-header, .app-footer, .no-print, .pillar-tabs, .pager, .flash { display: none !important; }
  body { background: #fff; color: #000; font-size: 10pt; }
  main { max-width: none; padding: 0; }
  .card, .kpi { box-shadow: none; break-inside: avoid; }
  .report { display: block; }
  .report-page { width: auto; min-height: 0; padding: 0; box-shadow: none; break-after: page; }
  .report-page.report-last { break-after: auto; }
  .report-table tr, .report-item { break-inside: avoid; }
  .table-wrap { overflow: visible; }
  .portfolio th:last-child, .portfolio td:last-child { display: none; }
  .report .evo-columns { grid-template-columns: 1fr 1fr; }
  .report .evo-kpis { grid-template-columns: repeat(5, 1fr); }
  .report .report-kpis { grid-template-columns: 1.4fr 1fr 1fr; }
  .report .report-swot { grid-template-columns: repeat(3, 1fr); }
}

  <script>
/* js/scoring.js */
/*
 * Scoring engine.
 *
 * Reproduces the hidden "Fiche de Calculs" sheet of the Excel workbook:
 *   - component : level chosen (1 to 4);
 *   - aspect    : mean of its components (e.g. D19 = AVERAGE(D16:D18));
 *   - pillar    : mean of its aspects (e.g. D81 = AVERAGE(D19,D21,D23,D27));
 *   - total     : sum of the 33 components (D74);
 *   - mean development index: mean of the 33 components (D76).
 *
 * Global index method (workspace setting):
 *   'components' (default, as in Excel): mean of all components. Pillars with
 *     more components weigh more (Governance 7/33, Planning 13/33, HR 5/33,
 *     Finance 8/33).
 *   'weighted': weighted mean of pillar scores using explicit weights
 *     (e.g. 25 % each).
 *
 * Deliberate difference from Excel: unanswered components are ignored in the
 * means (Excel showed #DIV/0! or counted zeros).
 */
(function (root) {
  'use strict';

  var CATEGORIES = ['maintain', 'opportunity', 'address'];

  function average(values) {
    var present = values.filter(function (v) { return typeof v === 'number' && !isNaN(v); });
    if (present.length === 0) return null;
    return present.reduce(function (a, b) { return a + b; }, 0) / present.length;
  }

  function isValidLevel(value, maxScore) {
    return typeof value === 'number' && value >= 1 && value <= maxScore && Math.floor(value) === value;
  }

  /** Strength to maintain (4), opportunity to catch (3), weakness to address (1-2). */
  function categoryFor(score, maxScore) {
    maxScore = maxScore || 4;
    if (score === null || score === undefined) return null;
    if (score >= maxScore) return 'maintain';
    if (score >= maxScore - 1) return 'opportunity';
    return 'address';
  }

  /** Effective share of each pillar in the global index, in percent. */
  function effectiveWeights(framework, settings) {
    var method = settings && settings.indexMethod === 'weighted' ? 'weighted' : 'components';
    var out = {};
    if (method === 'components') {
      var counts = framework.PILLARS.map(function (p) {
        return p.aspects.reduce(function (n, a) { return n + a.components.length; }, 0);
      });
      var total = counts.reduce(function (a, b) { return a + b; }, 0);
      framework.PILLARS.forEach(function (p, i) { out[p.id] = (counts[i] / total) * 100; });
    } else {
      var w = normalizedWeights(framework, settings.weights);
      framework.PILLARS.forEach(function (p) { out[p.id] = w[p.id] * 100; });
    }
    return out;
  }

  function normalizedWeights(framework, weights) {
    var raw = {};
    var sum = 0;
    framework.PILLARS.forEach(function (p) {
      var v = weights && Number(weights[p.id]);
      raw[p.id] = v > 0 ? v : 0;
      sum += raw[p.id];
    });
    framework.PILLARS.forEach(function (p) {
      raw[p.id] = sum > 0 ? raw[p.id] / sum : 1 / framework.PILLARS.length;
    });
    return raw;
  }

  /**
   * Computes every score of an assessment.
   * @param {object} framework  see framework.js
   * @param {object} answers    { componentId: level 1..4 }
   * @param {object} [settings] { indexMethod: 'components'|'weighted', weights: {pillarId: number} }
   */
  function computeScores(framework, answers, settings) {
    answers = answers || {};
    var max = framework.MAX_SCORE;
    var allScores = [];
    var answeredCount = 0;
    var totalCount = 0;
    var counts = { maintain: 0, opportunity: 0, address: 0 };

    var pillars = framework.PILLARS.map(function (pillar) {
      var pillarAnswered = 0;
      var pillarTotal = 0;
      var aspects = pillar.aspects.map(function (aspect) {
        var components = aspect.components.map(function (component) {
          var raw = answers[component.id];
          var score = isValidLevel(raw, max) ? raw : null;
          totalCount++;
          pillarTotal++;
          if (score !== null) {
            answeredCount++;
            pillarAnswered++;
            allScores.push(score);
            counts[categoryFor(score, max)]++;
          }
          return { id: component.id, name: component.name, score: score, category: categoryFor(score, max) };
        });
        var aspectScore = average(components.map(function (c) { return c.score; }));
        return { id: aspect.id, name: aspect.name, score: aspectScore, components: components };
      });
      var pillarScore = average(aspects.map(function (a) { return a.score; }));
      return {
        id: pillar.id,
        name: pillar.name,
        shortName: pillar.shortName,
        score: pillarScore,
        percent: pillarScore === null ? null : (pillarScore / max) * 100,
        answered: pillarAnswered,
        total: pillarTotal,
        aspects: aspects
      };
    });

    var componentIndex = average(allScores);

    // Weighted mean of pillar scores, re-normalised over pillars that have a score.
    var weights = normalizedWeights(framework, settings && settings.weights);
    var wSum = 0;
    var wTotal = 0;
    pillars.forEach(function (p) {
      if (p.score !== null) { wSum += p.score * weights[p.id]; wTotal += weights[p.id]; }
    });
    var weightedIndex = wTotal > 0 ? wSum / wTotal : null;

    var method = settings && settings.indexMethod === 'weighted' ? 'weighted' : 'components';
    var index = method === 'weighted' ? weightedIndex : componentIndex;

    return {
      maxScore: max,
      pillars: pillars,
      total: allScores.reduce(function (a, b) { return a + b; }, 0),
      maxTotal: totalCount * max,
      index: index,
      indexMethod: method,
      componentIndex: componentIndex,
      weightedIndex: weightedIndex,
      indexPercent: index === null ? null : (index / max) * 100,
      answered: answeredCount,
      totalComponents: totalCount,
      completion: totalCount ? answeredCount / totalCount : 0,
      complete: answeredCount === totalCount,
      counts: counts
    };
  }

  /** Compares two assessments (Excel "Score 1 / Score 2 / Changement"). */
  function compareScores(current, baseline) {
    function diff(a, b) {
      return a === null || b === null || a === undefined || b === undefined ? null : a - b;
    }
    return {
      index: diff(current.index, baseline.index),
      total: diff(current.total, baseline.total),
      pillars: current.pillars.map(function (p, i) {
        var bp = baseline.pillars[i];
        return {
          id: p.id,
          delta: diff(p.score, bp.score),
          aspects: p.aspects.map(function (a, j) {
            return { id: a.id, delta: diff(a.score, bp.aspects[j].score) };
          })
        };
      })
    };
  }

  /**
   * Groups answered components into strengths to maintain, opportunities to
   * catch and weaknesses to address. Each list is sorted (weakest first for
   * weaknesses).
   */
  function classify(framework, answers) {
    var groups = { maintain: [], opportunity: [], address: [] };
    framework.PILLARS.forEach(function (pillar) {
      pillar.aspects.forEach(function (aspect) {
        aspect.components.forEach(function (component) {
          var score = answers[component.id];
          if (!isValidLevel(score, framework.MAX_SCORE)) return;
          groups[categoryFor(score, framework.MAX_SCORE)].push({
            pillar: pillar,
            aspect: aspect,
            component: component,
            score: score
          });
        });
      });
    });
    groups.address.sort(function (a, b) { return a.score - b.score; });
    return groups;
  }

  /** Development stage for a mean score. */
  function stageFor(framework, score) {
    if (score === null || score === undefined) return null;
    var idx = Math.min(framework.LEVELS.length, Math.max(1, Math.round(score))) - 1;
    return framework.LEVELS[idx];
  }

  var Scoring = {
    CATEGORIES: CATEGORIES,
    average: average,
    categoryFor: categoryFor,
    effectiveWeights: effectiveWeights,
    computeScores: computeScores,
    compareScores: compareScores,
    classify: classify,
    stageFor: stageFor
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = Scoring;
  } else {
    root.BarometerScoring = Scoring;
  }
})(this);

</script>
  <script>
/* js/storage.js */
/*
 * Data model and local persistence (browser localStorage).
 *
 * Workspace (one per browser):
 *   { schemaVersion, settings, orgs: [Organisation], activeOrgId }
 * Organisation:
 *   { id, organization: {...profile}, assessments: [Assessment], activeAssessmentId, updatedAt }
 * Assessment:
 *   { id, sequence, year, createdAt, answers, comments, plan }
 * Plan:
 *   { startMonth: 'YYYY-MM' | '', challenges: {componentId: text}, activities: [Activity], generatedAt }
 *
 * An organisation exports its own file (.json); the facilitator imports
 * several of these files to get a portfolio overview.
 */
(function (root) {
  'use strict';

  var STORAGE_KEY = 'barometre-gouvernance:v2';
  var LEGACY_KEY = 'barometre-gouvernance:v1';
  var SCHEMA_VERSION = 2;
  var MONTHS = 24;
  var STATUSES = ['planned', 'ongoing', 'done'];
  var PLAN_CATEGORIES = ['address', 'opportunity', 'maintain', 'other'];
  var PROFILE_FIELDS = ['name', 'acronym', 'type', 'region', 'address', 'focalPoint', 'phone', 'email'];
  var PRIORITY_VALUES = ['essential', 'important', 'neutral'];

  function uid(prefix) {
    return (prefix || 'x') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function str(v) { return typeof v === 'string' ? v : ''; }

  function clampMonth(v, fallback) {
    var n = Number(v);
    if (!(n >= 1 && n <= MONTHS)) return fallback;
    return Math.round(n);
  }

  function defaultSettings() {
    return { lang: 'fr', indexMethod: 'components', weights: { gov: 25, plan: 25, hr: 25, fin: 25 } };
  }

  function emptyPlan() {
    return { startMonth: '', challenges: {}, activities: [], generatedAt: null };
  }

  function newActivity(fields) {
    fields = fields || {};
    return {
      id: fields.id || uid('t'),
      componentId: fields.componentId || null,
      category: PLAN_CATEGORIES.indexOf(fields.category) >= 0 ? fields.category : 'other',
      source: fields.source === 'standard' ? 'standard' : 'custom',
      standardKey: fields.standardKey || null,
      title: str(fields.title),
      indicator: str(fields.indicator),
      lead: str(fields.lead),
      start: clampMonth(fields.start, 1),
      end: clampMonth(fields.end, MONTHS),
      resourcesAvailable: str(fields.resourcesAvailable),
      resourcesAnticipated: str(fields.resourcesAnticipated),
      baseline: str(fields.baseline),
      target: str(fields.target),
      priority: PRIORITY_VALUES.indexOf(fields.priority) >= 0 ? fields.priority : '',
      verification: str(fields.verification),
      status: STATUSES.indexOf(fields.status) >= 0 ? fields.status : 'planned',
      edited: !!fields.edited
    };
  }

  function newAssessment(sequence, year) {
    return {
      id: uid('a'),
      sequence: sequence || 1,
      year: year || new Date().getFullYear(),
      period: '',
      createdAt: new Date().toISOString(),
      answers: {},
      comments: {},
      plan: emptyPlan()
    };
  }

  function newOrg(name) {
    var first = newAssessment(1);
    var profile = {};
    PROFILE_FIELDS.forEach(function (f) { profile[f] = ''; });
    profile.name = name || '';
    return {
      id: uid('o'),
      organization: profile,
      assessments: [first],
      activeAssessmentId: first.id,
      updatedAt: new Date().toISOString()
    };
  }

  function newWorkspace() {
    var org = newOrg('');
    return { schemaVersion: SCHEMA_VERSION, settings: defaultSettings(), orgs: [org], activeOrgId: org.id };
  }

  // ------------------------------------------------------------ normalisation

  function normalizeSettings(s) {
    var out = defaultSettings();
    s = s || {};
    if (s.lang === 'en' || s.lang === 'fr') out.lang = s.lang;
    if (s.indexMethod === 'weighted') out.indexMethod = 'weighted';
    if (s.weights) {
      Object.keys(out.weights).forEach(function (k) {
        var v = Number(s.weights[k]);
        if (v >= 0 && v <= 100) out.weights[k] = v;
      });
    }
    return out;
  }

  /** Converts a version-1 per-component plan into challenges + custom activities. */
  function migrateLegacyPlan(legacy) {
    var plan = emptyPlan();
    Object.keys(legacy || {}).forEach(function (cid) {
      var item = legacy[cid] || {};
      if (str(item.challenge)) plan.challenges[cid] = item.challenge;
      var months = Array.isArray(item.months) ? item.months : [];
      var first = months.indexOf(true);
      var last = months.lastIndexOf(true);
      var hasContent = ['activities', 'lead', 'indicator', 'target', 'verification'].some(function (f) { return str(item[f]); });
      if (!hasContent && first < 0) return;
      var priorityMap = { Essentiel: 'essential', Important: 'important', Neutre: 'neutral' };
      plan.activities.push(newActivity({
        componentId: cid,
        category: 'other',
        source: 'custom',
        title: str(item.activities),
        indicator: str(item.indicator),
        lead: str(item.lead),
        start: first >= 0 ? first + 1 : 1,
        end: last >= 0 ? last + 1 : MONTHS,
        resourcesAvailable: str(item.resourcesAvailable),
        resourcesAnticipated: str(item.resourcesAnticipated),
        baseline: str(item.baseline),
        target: str(item.target),
        priority: priorityMap[item.priority] || item.priority,
        verification: str(item.verification),
        edited: true
      }));
    });
    return plan;
  }

  function normalizePlan(p) {
    if (!p) return emptyPlan();
    if (!Array.isArray(p.activities)) return migrateLegacyPlan(p);
    var plan = emptyPlan();
    plan.startMonth = /^\d{4}-\d{2}$/.test(p.startMonth) ? p.startMonth : '';
    plan.generatedAt = p.generatedAt || null;
    Object.keys(p.challenges || {}).forEach(function (k) {
      if (typeof p.challenges[k] === 'string') plan.challenges[k] = p.challenges[k];

    plan.activities = p.activities.map(function (a) {
      var act = newActivity(a);
      if (act.end < act.start) act.end = act.start;
      return act;
    });
    return plan;
  }

  function normalizeAssessment(a) {
    var base = newAssessment(Number(a.sequence) || 1, Number(a.year) || new Date().getFullYear());
    if (typeof a.id === 'string' && a.id) base.id = a.id;
    base.createdAt = a.createdAt || base.createdAt;
    base.period = /^\d{4}-(0[1-9]|1[0-2])$/.test(a.period || '') ? a.period : '';
    if (base.period) base.year = Number(base.period.slice(0, 4));
    Object.keys(a.answers || {}).forEach(function (k) {
      var v = Number(a.answers[k]);
      if (v >= 1 && v <= 4 && Math.floor(v) === v) base.answers[k] = v;
    });
    Object.keys(a.comments || {}).forEach(function (k) {
      if (typeof a.comments[k] === 'string') base.comments[k] = a.comments[k];
    });

    return base;
  }

  function normalizeOrg(o) {
    if (!o || typeof o !== 'object') throw new Error('invalid');
    if (!Array.isArray(o.assessments) || o.assessments.length === 0) throw new Error('no-assessment');

    if (typeof o.id === 'string' && o.id) org.id = o.id;
    var profile = o.organization || {};

    org.assessments = o.assessments.map(normalizeAssessment);
    var ids = org.assessments.map(function (a) { return a.id; });
    org.activeAssessmentId = ids.indexOf(o.activeAssessmentId) >= 0 ? o.activeAssessmentId : ids[ids.length - 1];
    org.updatedAt = o.updatedAt || org.updatedAt;
    return org;
  }

  function normalizeWorkspace(data) {
    if (!data || typeof data !== 'object') throw new Error('invalid');
    // Version-1 file: a single organisation at the top level.
    if (!Array.isArray(data.orgs)) {
      var ws = newWorkspace();
      ws.orgs = [normalizeOrg(data)];
      ws.activeOrgId = ws.orgs[0].id;
      return ws;
    }
    if (data.orgs.length === 0) throw new Error('no-org');
    var out = { schemaVersion: SCHEMA_VERSION, settings: normalizeSettings(data.settings), orgs: data.orgs.map(normalizeOrg) };
    var ids = out.orgs.map(function (o) { return o.id; });
    out.activeOrgId = ids.indexOf(data.activeOrgId) >= 0 ? data.activeOrgId : ids[0];
    return out;
  }

  /**
   * Reads an imported file and returns the organisations it contains:
   * an organisation export, a workspace backup or a version-1 file.
   */
  function parseImport(data) {
    if (!data || typeof data !== 'object') throw new Error('invalid');
    if (data.type === 'barometer-organization' && data.org) return { orgs: [normalizeOrg(data.org)], settings: null };
    if (Array.isArray(data.orgs)) {

      return { orgs: ws.orgs, settings: ws.settings };

  function mergeOrgs(workspace, orgs) {

    var replaced = 0;

      var idx = -1;
      workspace.orgs.forEach(function (o, i) { if (o.id === org.id) idx = i; });
      if (idx >= 0) { workspace.orgs[idx] = org; replaced++; } else { workspace.orgs.push(org); added++; }

    var plotH = H - padT - padB;
