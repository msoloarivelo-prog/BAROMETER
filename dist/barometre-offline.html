  <script>
/* js/views-facilitator.js */
/*
 * Facilitator space: portfolio overview of every organisation in the
 * workspace (imported from the files organisations export), common
 * weaknesses, and calculation settings (pillar weights).
 */
(function () {
  'use strict';

  var App = window.App;
  var F = App.F;
  var S = App.S;
  var Plan = App.Plan;
  var Store = App.Store;
  var esc = App.esc;
  var t = App.t;
  var L = App.L;
  var A = App.actions;

  /** Model shown in the portfolio (comparisons only make sense within one model). */
  function facModel() {
    var used = App.Models.list().filter(function (m) {
      return App.ws.orgs.some(function (o) { return o.assessments.some(function (a) { return a.model === m.id; }); });
    });
    var ids = used.map(function (m) { return m.id; });
    var id = ids.indexOf(App.ui.facModel) >= 0 ? App.ui.facModel : (ids[0] || 'barometer');
    F = App.Models.get(id);
    return { id: id, used: used };
  }

  function portfolio(model) {
    return App.ws.orgs.map(function (org) {
      var a = App.latestAssessment(org, model);
      if (!a) return { org: org, assessment: null, scores: null, delta: null, plan: { total: 0, done: 0, progress: 0 } };
      var r = App.scores(a);
      var prev = App.previousAssessment(org, a);
      return {
        org: org,
        assessment: a,
        scores: r,
        delta: prev ? S.compareScores(r, App.scores(prev)).index : null,
        plan: Plan.stats(a.plan)
      };
    });
  }

  function heatClass(score) {
    if (score === null || score === undefined) return 'heat-none';
    if (score >= 3.5) return 'heat-4';
    if (score >= 2.5) return 'heat-3';
    if (score >= 1.5) return 'heat-2';
    return 'heat-1';
  }

  function settingsCard() {
    var F = App.Models.get('barometer');
    var s = App.settings();
    var eff = S.effectiveWeights(F, s);
    var sum = F.PILLARS.reduce(function (n, p) { return n + (Number(s.weights[p.id]) || 0); }, 0);
    return '<section class="card no-print" id="settings"><h2>' + esc(t('fac.settings')) + ' — ' + esc(L(F.shortName)) + '</h2>' +
      '<p class="muted small">' + esc(t('fac.otherModels')) + '</p>' +
      '<p class="muted">' + esc(t('fac.weightsExplain')) + '</p>' +
      '<fieldset class="method"><legend>' + esc(t('fac.method')) + '</legend>' +
        '<label><input type="radio" name="index-method" value="components" data-on="index-method"' + (s.indexMethod !== 'weighted' ? ' checked' : '') + '> ' + esc(t('fac.methodComponents')) + '</label>' +
        '<label><input type="radio" name="index-method" value="weighted" data-on="index-method"' + (s.indexMethod === 'weighted' ? ' checked' : '') + '> ' + esc(t('fac.methodWeighted')) + '</label>' +
      '</fieldset>' +
      '<div class="table-wrap"><table class="table weights"><thead><tr><th></th><th>' + esc(t('fac.weight')) + '</th><th>' + esc(t('fac.effective')) + '</th></tr></thead><tbody>' +
      F.PILLARS.map(function (p) {
        return '<tr><td><span class="dot" style="background:' + p.color + '"></span>' + esc(L(p.name)) + '</td>' +
          '<td><input type="number" min="0" max="100" step="1" data-on="weight" data-id="' + p.id + '" value="' + esc(s.weights[p.id]) + '"' +
          (s.indexMethod !== 'weighted' ? ' disabled' : '') + '> %</td>' +
          '<td>' + App.fmt(eff[p.id], 1) + ' %</td></tr>';
      }).join('') + '</tbody></table></div>' +
      (s.indexMethod === 'weighted' && sum !== 100 ? '<p class="notice small">' + esc(t('fac.sumWarn', { sum: sum })) + '</p>' : '') +
      '</section>';
  }

  App.views.facilitator = function () {
    var fm = facModel();
    var rows = portfolio(fm.id);
    var assessed = rows.filter(function (x) { return x.assessment; });
    var withScores = assessed.filter(function (x) { return x.scores.index !== null; });
    var complete = assessed.filter(function (x) { return x.scores.complete; }).length;
    var avgIndex = S.average(withScores.map(function (x) { return x.scores.index; }));
    var actTotal = rows.reduce(function (n, x) { return n + x.plan.total; }, 0);
    var actDone = rows.reduce(function (n, x) { return n + x.plan.done; }, 0);

    var html = '<div class="page-head"><div><h1>' + esc(t('fac.title')) + '</h1><p class="muted">' + esc(t('fac.intro')) + '</p></div>' +
      '<div class="actions no-print">' +
        '<label class="btn primary">⤒ ' + esc(t('fac.import')) + '<input type="file" accept=".json,application/json" multiple data-on="import-files" hidden></label>' +
        '<button class="btn" data-click="fac-new-org">' + esc(t('fac.newOrg')) + '</button>' +
        '<button class="btn" data-click="load-demo">▶ ' + esc(t('demo.load')) + '</button>' +
        '<button class="btn" data-click="fac-export-csv">' + esc(t('fac.exportCsv')) + '</button>' +
        '<button class="btn" data-click="fac-print">' + esc(t('print')) + '</button>' +
      '</div></div>';

    html += '<div class="fac-model-bar"><span>' + esc(t('fac.modelShown')) + '</span><div class="segmented" role="group">' +
      App.Models.list().map(function (m) {
        return '<button class="' + (m.id === fm.id ? 'active' : '') + '" data-click="fac-model" data-model="' + m.id + '">' + esc(L(m.shortName)) + '</button>';
      }).join('') + '</div><span class="muted small">' + esc(L(F.description)) + '</span></div>';

    html += '<section class="summary fac-summary">' +
      kpi(t('fac.orgs'), rows.length) +
      kpi(t('fac.assessed'), complete + '<small> / ' + assessed.length + '</small>') +
      kpi(t('fac.avgIndex'), App.fmt(avgIndex, 2) + '<small> / 4</small>') +
      kpi(t('fac.activities'), actDone + '<small> / ' + actTotal + '</small>') +
      '</section>';

    // Organisations table
    html += '<section class="card"><h2>' + esc(t('fac.table')) + '</h2><div class="table-wrap"><table class="table portfolio"><thead><tr>' +
      '<th>' + esc(t('profile.org')) + '</th><th>' + esc(t('fac.latest')) + '</th><th>' + esc(t('profile.progress')) + '</th>' +
      '<th>' + esc(t('profile.index')) + '</th>' +
      F.PILLARS.map(function (p) { return '<th class="center" title="' + esc(L(p.name)) + '">' + esc(L(p.shortName)) + '</th>'; }).join('') +
      '<th class="center">▼ ' + esc(t('fac.weak')) + '</th><th>' + esc(t('fac.planProgress')) + '</th><th class="no-print"></th></tr></thead><tbody>' +
      rows.map(function (x) {
        var o = x.org.organization;
        if (!x.assessment) {
          return '<tr class="no-assessment"><td><strong>' + esc(App.orgName(x.org)) + '</strong></td><td colspan="' + (F.PILLARS.length + 5) + '" class="muted">' +
            esc(t('fac.noneOfModel', { model: L(F.shortName) })) + '</td><td class="row-actions no-print">' +
            '<button class="btn small" data-click="fac-open" data-id="' + esc(x.org.id) + '" data-route="new">' + esc(t('new.start')) + '</button></td></tr>';
        }
        return '<tr' + (x.org.id === App.ws.activeOrgId ? ' class="current"' : '') + '>' +
          '<td><strong>' + esc(App.orgName(x.org)) + '</strong>' + (o.acronym ? ' <span class="muted">(' + esc(o.acronym) + ')</span>' : '') +
            (o.region || o.country || o.type ? '<br><span class="muted small">' + esc([o.type, App.locationText(o)].filter(Boolean).join(' · ')) + '</span>' : '') + '</td>' +
          '<td>' + esc(App.assessmentLabel(x.assessment)) + '</td>' +
          '<td><div class="progress mini"><div style="width:' + Math.round(x.scores.completion * 100) + '%"></div></div><span class="small">' + x.scores.answered + '/' + x.scores.totalComponents + '</span></td>' +
          '<td class="nowrap"><strong>' + App.fmt(x.scores.index, 2) + '</strong>' +
            (x.delta !== null ? ' <span class="delta ' + (x.delta > 0 ? 'up' : x.delta < 0 ? 'down' : 'flat') + '">' + (x.delta > 0 ? '+' : '') + App.fmt(x.delta, 2) + '</span>' : '') + '</td>' +
          x.scores.pillars.map(function (p) { return '<td class="heat ' + heatClass(p.score) + '">' + App.fmt(p.score) + '</td>'; }).join('') +
          '<td class="center">' + x.scores.counts.address + '</td>' +
          '<td><div class="progress mini"><div style="width:' + Math.round(x.plan.progress * 100) + '%"></div></div><span class="small">' + x.plan.done + '/' + x.plan.total + '</span></td>' +
          '<td class="row-actions no-print">' +
            '<button class="btn small" data-click="fac-open" data-id="' + esc(x.org.id) + '" data-route="results">' + esc(t('nav.results')) + '</button> ' +
            '<button class="btn small" data-click="fac-open" data-id="' + esc(x.org.id) + '" data-route="report">' + esc(t('nav.report')) + '</button> ' +
            (rows.length > 1 ? '<button class="btn small ghost danger" data-click="delete-org" data-id="' + esc(x.org.id) + '" title="' + esc(t('delete')) + '">✕</button>' : '') +
          '</td></tr>';
      }).join('') +
      '</tbody></table></div></section>';

    // Pillar averages + common weaknesses
    var pillarAvg = F.PILLARS.map(function (p, i) {
      return { label: L(p.name), value: S.average(withScores.map(function (x) { return x.scores.pillars[i].score; })), color: p.color };
    });
    var weakCount = {};
    assessed.forEach(function (x) {
      Object.keys(x.assessment.answers).forEach(function (cid) {
        if (S.categoryFor(x.assessment.answers[cid]) === 'address') weakCount[cid] = (weakCount[cid] || 0) + 1;
      });
    });
    var common = Object.keys(weakCount).map(function (cid) { return { entry: App.findComponent(cid), n: weakCount[cid] }; })
      .filter(function (w) { return w.entry; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 10);

    html += '<section class="fac-grid">' +
      '<article class="card"><h2>' + esc(t('fac.pillarAvg')) + '</h2><div id="fac-pillars"></div></article>' +
      '<article class="card"><h2>' + esc(t('fac.commonWeak')) + '</h2><p class="muted small">' + esc(t('fac.commonWeakHelp')) + '</p>' +
        (common.length ? '<div id="fac-common"></div>' : '<p class="muted">' + esc(t('fac.empty')) + '</p>') + '</article>' +
      '</section>';

    html += settingsCard();

    html += '<section class="card no-print"><h2>' + esc(t('profile.share')) + '</h2><div class="actions">' +
      '<button class="btn" data-click="fac-backup">' + esc(t('fac.backup')) + '</button>' +
      '<label class="btn">' + esc(t('fac.restore')) + '<input type="file" accept=".json,application/json" data-on="fac-restore" hidden></label>' +
      '<button class="btn danger" data-click="fac-reset">' + esc(t('fac.reset')) + '</button>' +
      '</div></section>';

    App.setView(html);

    document.getElementById('fac-pillars').appendChild(App.Charts.bars(pillarAvg, F.MAX_SCORE));
    var commonSlot = document.getElementById('fac-common');
    if (commonSlot) {
      commonSlot.appendChild(App.Charts.bars(common.map(function (w) {
        return { label: L(w.entry.component.name) + ' (' + L(w.entry.pillar.shortName) + ')', value: w.n, color: '#d9534f' };
      }), Math.max(rows.length, 1), { format: function (v) { return v + ' / ' + rows.length; } }));
    }
  };

  function kpi(label, value) {
    return '<div class="kpi"><span class="kpi-label">' + esc(label) + '</span><span class="kpi-value">' + value + '</span></div>';
  }

  A['fac-model'] = function (el) {
    App.ui.facModel = el.dataset.model;
    App.render();
  };

  A['fac-open'] = function (el) {
    App.ws.activeOrgId = el.dataset.id;
    var org = App.org();
    var latest = App.latestAssessment(org, F.id);
    if (latest) org.activeAssessmentId = latest.id;
    App.ui.compareWith = null;
    App.persist(true);
    location.hash = '#' + el.dataset.route;
  };

  A['fac-new-org'] = function () {
    var org = Store.newOrg('');
    App.ws.orgs.push(org);
    App.ws.activeOrgId = org.id;
    App.persist(true);
    location.hash = '#profile';
  };

  A['index-method'] = function (el) {
    App.settings().indexMethod = el.value === 'weighted' ? 'weighted' : 'components';
    App.persist(true);
    App.render();
  };

  A.weight = function (el) {
    var v = Number(el.value);
    if (!(v >= 0 && v <= 100)) return;
    App.settings().weights[el.dataset.id] = v;
    App.persist(true);
    App.render();
  };

  A['fac-export-csv'] = function () {
    var fm = facModel();
    var header = [t('profile.name'), t('profile.acronym'), t('profile.type'), t('profile.country'), t('profile.region'), t('fac.latest'),
      t('profile.progress'), t('profile.index')].concat(F.PILLARS.map(function (p) { return L(p.name); }))
      .concat([t('cats.maintain'), t('cats.opportunity'), t('cats.address'), t('plan.activities'), t('status.done')]);
    var rows = [header];
    portfolio(fm.id).forEach(function (x) {
      if (!x.assessment) return;
      var o = x.org.organization;
      rows.push([App.orgName(x.org), o.acronym, o.type, o.country, o.region, App.assessmentLabel(x.assessment),
        x.scores.answered + '/' + x.scores.totalComponents, App.num(x.scores.index)]
        .concat(x.scores.pillars.map(function (p) { return App.num(p.score); }))
        .concat([x.scores.counts.maintain, x.scores.counts.opportunity, x.scores.counts.address, x.plan.total, x.plan.done]));
    });
    App.download('portfolio-' + fm.id + '-' + new Date().toISOString().slice(0, 10) + '.csv', App.csv(rows), 'text/csv;charset=utf-8');
  };

  A['fac-print'] = function () { window.print(); };

  A['fac-backup'] = function () {
    window.BarometerFiles.exportFiles(App.ws.orgs)['catch'](function () { return []; }).then(function (files) {
      var data = Store.exportWorkspace(App.ws);
      data.files = files;
      App.download('barometer-workspace-' + new Date().toISOString().slice(0, 10) + '.json',
        JSON.stringify(data, null, 2), 'application/json');

  };

  A['fac-restore'] = function (el) {
    App.readJsonFiles(el.files, function (results) {
      var r = results[0];
      try {
        if (r.error) throw new Error('invalid');
        var ws = Store.normalizeWorkspace(r.data);
        if (!confirm(t('fac.confirmRestore'))) return;
        if (Array.isArray(r.data.files)) window.BarometerFiles.importFiles(r.data.files)['catch'](function () {});
        App.ws = ws;
        App.persist(true);
        App.render();
      } catch (e) {
        App.flash(t('fac.importError', { msg: App.errMsg(e) }));
        App.render();
      }
    });

  };

  A['fac-reset'] = function () {
    if (!confirm(t('fac.confirmReset'))) return;
    var lang = App.settings().lang;
    Store.clear();
    App.ws = Store.newWorkspace();
    App.ws.settings.lang = lang;
    App.persist(true);
    location.hash = '#home';
    App.render();
  };
})();

  <script>
/* js/views-evolution.js */
/*
 * Evolution over time (regular assessments) and the comparative report.
 *
 * #evolution : trend of the global index and pillars across every period,
 *              table of all periods, and a detailed comparison between two
 *              chosen periods (improved / declined components, weaknesses
 *              resolved, new weaknesses, workplan follow-up).
 * #report in "evolution" mode : the same content as printable A4 pages.
 */
(function () {
  'use strict';

  var App = window.App;
  var F = App.F;
  var Evo = window.BarometerEvolution;
  var esc = App.esc;
  var t = App.t;
  var L = App.L;
  var A = App.actions;

  /** Model shown on the page: the chosen one if the organisation has it, else the active assessment's model. */
  function currentModel(org) {
    var models = App.Models.list().filter(function (m) { return org.assessments.some(function (a) { return a.model === m.id; }); });
    var ids = models.map(function (m) { return m.id; });
    var model = ids.indexOf(App.ui.evoModel) >= 0 ? App.ui.evoModel : App.assessment(org).model;
    F = App.Models.get(model);
    return { model: model, models: models };
  }

  function modelSwitch(cm) {
    if (cm.models.length < 2) return '';
    return '<div class="segmented no-print" role="group">' + cm.models.map(function (m) {
      return '<button class="' + (m.id === cm.model ? 'active' : '') + '" data-click="evo-model" data-model="' + m.id + '">' + esc(L(m.shortName)) + '</button>';
    }).join('') + '</div>';
  }

  /** Selected periods (same model), defaulting to the previous and the latest assessment. */
  function periods(org) {
    var list = App.chronological(org, currentModel(org).model);
    var ids = list.map(function (a) { return a.id; });
    if (ids.indexOf(App.ui.evoTo) < 0) App.ui.evoTo = ids[ids.length - 1];
    if (ids.indexOf(App.ui.evoFrom) < 0 || App.ui.evoFrom === App.ui.evoTo) {
      var toIdx = ids.indexOf(App.ui.evoTo);
      App.ui.evoFrom = ids[toIdx > 0 ? toIdx - 1 : (ids.length > 1 ? 1 : 0)];
    }
    return {
      list: list,
      from: list[ids.indexOf(App.ui.evoFrom)],
      to: list[ids.indexOf(App.ui.evoTo)]
    };
  }

  function deltaCell(d, digits) {
    if (d === null || d === undefined) return '<td class="center muted">—</td>';
    var cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    return '<td class="center delta ' + cls + '">' + (d > 0 ? '+' : '') + App.fmt(d, digits === undefined ? 1 : digits) + '</td>';
  }

  /** Table: one column per period, last column = change first -> last. */
  function periodTable(tl, cls) {
    var first = tl[0].scores;
    var last = tl[tl.length - 1].scores;
    function row(label, get, digits, strong) {
      var vals = tl.map(function (x) { return get(x); });
      var d = vals[0] === null || vals[vals.length - 1] === null ? null : vals[vals.length - 1] - vals[0];
      return '<tr' + (strong ? ' class="total"' : '') + '><td>' + label + '</td>' +
        vals.map(function (v) { return '<td class="center">' + (v === null ? '—' : App.fmt(v, digits)) + '</td>'; }).join('') +
        deltaCell(d, digits) + '</tr>';
    }
    var html = '<div class="table-wrap"><table class="' + cls + ' period-table"><thead><tr><th></th>' +
      tl.map(function (x) { return '<th class="center">' + esc(App.sequenceLabel(x.assessment.sequence)) + '<br><span class="muted">' + esc(App.periodShort(x.assessment)) + '</span></th>'; }).join('') +
      '<th class="center">Δ</th></tr></thead><tbody>';
    html += row('<strong>' + esc(t('results.index')) + '</strong>', function (x) { return x.scores.index; }, 2, true);
    F.PILLARS.forEach(function (p, i) {
      html += row('<span class="dot" style="background:' + p.color + '"></span>' + esc(L(p.name)), function (x) { return x.scores.pillars[i].score; }, 1);
    });
    html += row(esc(t('results.total')), function (x) { return x.scores.answered ? x.scores.total : null; }, 0);
    ['maintain', 'opportunity', 'address'].forEach(function (c) {
      html += row(App.CAT_ICONS[c] + ' ' + esc(t('cats.' + c)), function (x) { return x.scores.answered ? x.scores.counts[c] : null; }, 0);
    });
    html += row(esc(t('evo.planDone')), function (x) {
      var f = Evo.planFollowUp(x.assessment);
      return f.rate === null ? null : f.rate * 100;
    }, 0);
    html += '</tbody></table></div>';
    void first; void last;
    return html;
  }

  function chart(tl, palette) {
    var colorKey = palette === 'report' ? 'reportColor' : 'color';
    var labels = tl.map(function (x) { return App.periodShort(x.assessment); });
    var series = [{ label: t('results.index'), color: '#1d2733', width: 3.5, showValues: true, values: tl.map(function (x) { return x.scores.index; }) }];
    F.PILLARS.forEach(function (p, i) {
      series.push({ label: L(p.shortName), color: p[colorKey], width: 2, values: tl.map(function (x) { return x.scores.pillars[i].score; }) });
    });
    return App.Charts.lines(series, labels, F.MAX_SCORE, { label: t('evo.chart') });
  }

  function itemRow(it) {
    return '<tr><td>' + esc(L(it.component.name)) + '<br><span class="muted small">' + esc(App.componentContext(F, it.pillar, it.aspect)) + '</span></td>' +
      '<td class="center nowrap">' + App.levelBadge(it.from) + ' → ' + App.levelBadge(it.to) + '</td>' +
      deltaCell(it.delta, 0) + '</tr>';
  }

  function changeList(title, items, cls, tableCls) {
    return '<div class="evo-list ' + cls + '"><h3>' + title + ' <b>' + items.length + '</b></h3>' +
      (items.length
        ? '<table class="' + tableCls + '"><tbody>' + items.map(itemRow).join('') + '</tbody></table>'
        : '<p class="muted small">' + esc(t('results.noItems')) + '</p>') + '</div>';
  }

  function changesSection(ch, tableCls) {
    var kpis = [
      ['improved', ch.improved.length, 'up'],
      ['declined', ch.declined.length, 'down'],
      ['stable', ch.stable.length, 'flat'],
      ['resolved', ch.resolvedWeaknesses.length, 'up'],
      ['newWeak', ch.newWeaknesses.length, 'down']
    ];
    return '<div class="evo-kpis">' + kpis.map(function (k) {
      return '<div class="evo-kpi ' + k[2] + '"><strong>' + k[1] + '</strong><span>' + esc(t('evo.' + k[0])) + '</span></div>';
    }).join('') + '</div>' +
      (ch.notCompared ? '<p class="muted small">' + esc(t('evo.notCompared', { n: ch.notCompared })) + '</p>' : '') +
      '<div class="evo-columns">' +
        changeList('▲ ' + esc(t('evo.improvedList')), ch.improved, 'up', tableCls) +
        changeList('▼ ' + esc(t('evo.declinedList')), ch.declined, 'down', tableCls) +
      '</div>' +
      '<div class="evo-columns">' +
        changeList('✓ ' + esc(t('evo.resolvedList')), ch.resolvedWeaknesses, 'up', tableCls) +
        changeList('! ' + esc(t('evo.newWeakList')), ch.newWeaknesses, 'down', tableCls) +
      '</div>';
  }

  function followUpSection(a) {
    var f = Evo.planFollowUp(a);
    var lang = App.I18n.getLang();
    if (!f.stats.total) return '<p class="muted">' + esc(t('evo.noPlan')) + '</p>';
    return '<p>' + esc(t('evo.followUpSentence', {
      period: App.assessmentLabel(a), total: f.stats.total, done: f.stats.done, ongoing: f.stats.ongoing, rate: App.fmt(f.rate * 100, 0)
    })) + '</p>' +
      '<div class="progress-line"><div class="progress"><div style="width:' + Math.round(f.stats.progress * 100) + '%"></div></div></div>' +
      (f.done.length ? '<h3>' + esc(t('evo.doneList')) + '</h3><ul class="done-list">' + f.done.map(function (act) {
        var e = act.componentId ? App.findComponent(act.componentId) : null;
        return '<li>✓ ' + esc(App.Plan.resolveTexts(act, lang).title) + ' <span class="muted small">— ' + esc(e ? L(e.component.name) : t('plan.general')) + '</span></li>';
      }).join('') + '</ul>' : '');
  }

  function selectors(p) {
    function sel(action, current) {
      return '<select data-on="' + action + '">' + p.list.map(function (a) {
        return '<option value="' + esc(a.id) + '"' + (a.id === current.id ? ' selected' : '') + '>' + esc(App.assessmentLabel(a)) + '</option>';
      }).join('') + '</select>';
    }
    return '<div class="evo-selectors"><label class="inline-field">' + esc(t('evo.from')) + ' ' + sel('evo-from', p.from) + '</label>' +
      '<label class="inline-field">' + esc(t('evo.to')) + ' ' + sel('evo-to', p.to) + '</label></div>';
  }

  // ------------------------------------------------------------------ page

  App.views.evolution = function () {
    var org = App.org();
    var p = periods(org);
    var cm = currentModel(org);
    var html = '<div class="page-head"><div><h1>' + esc(t('evo.title')) + '</h1><p class="muted">' + esc(App.orgName(org)) + ' — ' +
      esc(L(F.shortName)) + ' — ' + esc(t('evo.count', { n: p.list.length })) + '</p></div>' +
      '<div class="actions no-print">' + modelSwitch(cm) + '<button class="btn" data-click="new-assessment">' + esc(t('header.newAssessment')) + '</button>' +
      (p.list.length > 1 ? '<button class="btn primary" data-click="report-mode" data-mode="evolution">' + esc(t('evo.toReport')) + '</button>' : '') +
      '</div></div><p class="muted">' + esc(t('evo.intro')) + '</p>';

    if (p.list.length < 2) {
      App.setView(html + '<div class="notice">' + esc(t('evo.needTwo')) + '</div>');
      return;
    }

    var tl = Evo.timeline(F, p.list, App.Models.scoringSettings(F, App.settings()));
    var first = tl[0].scores.index;
    var last = tl[tl.length - 1].scores.index;
    html += '<section class="summary evo-summary">' +
      kpi(t('evo.first') + ' (' + App.periodShort(p.list[0]) + ')', App.fmt(first, 2) + '<small> / 4</small>') +
      kpi(t('evo.latest') + ' (' + App.periodShort(p.list[p.list.length - 1]) + ')', App.fmt(last, 2) + '<small> / 4</small>') +
      kpi(t('evo.change'), first === null || last === null ? '—' : (last - first > 0 ? '+' : '') + App.fmt(last - first, 2)) +
      kpi(t('evo.assessments'), String(p.list.length)) +
      '</section>' +
      '<section class="card"><h2>' + esc(t('evo.chart')) + '</h2><div id="evo-chart"></div></section>' +
      '<section class="card"><h2>' + esc(t('evo.table')) + '</h2>' + periodTable(tl, 'table') + '</section>';

    var ch = Evo.componentChanges(F, p.from.answers, p.to.answers);
    html += '<section class="card"><div class="page-head"><h2>' + esc(t('evo.compare')) + '</h2>' + selectors(p) + '</div>' +
      changesSection(ch, 'table compact') + '</section>' +
      '<section class="card"><h2>' + esc(t('evo.followUp')) + ' — ' + esc(App.assessmentLabel(p.from)) + '</h2>' + followUpSection(p.from) + '</section>';

    App.setView(html);
    document.getElementById('evo-chart').appendChild(chart(tl));
  };

  function kpi(label, value) {
    return '<div class="kpi"><span class="kpi-label">' + esc(label) + '</span><span class="kpi-value">' + value + '</span></div>';
  }

  // ------------------------------------------------------------------ comparative report

  App.renderEvolutionReport = function (headHtml) {
    var org = App.org();
    var o = org.organization;
    var p = periods(org);
    if (p.list.length < 2) {
      App.setView(headHtml + '<div class="notice">' + esc(t('evo.needTwo')) + '</div>');
      return;
    }
    var tl = Evo.timeline(F, p.list, App.Models.scoringSettings(F, App.settings()));
    var first = tl[0].scores.index;
    var last = tl[tl.length - 1].scores.index;
    var ch = Evo.componentChanges(F, p.from.answers, p.to.answers);
    var range = App.periodLabel(p.list[0]) + ' – ' + App.periodLabel(p.list[p.list.length - 1]);

    function header(title) {
      return '<header class="report-header"><div><div class="report-kicker">' + esc(t('app.title')) + '</div><h2>' + esc(title) + '</h2></div>' +
        '<div class="report-meta">' + esc(App.orgName(org)) + (o.acronym ? ' (' + esc(o.acronym) + ')' : '') + '<br>' + esc(range) + '</div></header>';
    }

    var html = headHtml + '<div class="no-print evo-report-controls">' + modelSwitch(currentModel(org)) + selectors(p) + '</div><div class="report">';

    html += '<section class="report-page">' +
      '<div class="report-cover"><div class="report-kicker">' + esc(t('app.title')) + '</div>' +
        '<h1>' + esc(t('evo.reportTitle')) + '</h1>' +
        '<div class="report-org">' + esc(App.orgName(org)) + (o.acronym ? ' <span>(' + esc(o.acronym) + ')</span>' : '') + '</div>' +
        '<dl class="report-facts">' +
          '<div><dt>' + esc(t('evo.period')) + '</dt><dd>' + esc(range) + '</dd></div>' +
          '<div><dt>' + esc(t('evo.assessments')) + '</dt><dd>' + p.list.length + '</dd></div>' +
          '<div><dt>' + esc(t('report.date')) + '</dt><dd>' + esc(App.dateStr()) + '</dd></div>' +
          (o.focalPoint ? '<div><dt>' + esc(t('profile.focalPoint')) + '</dt><dd>' + esc(App.focalText(o)) + '</dd></div>' : '') +
        '</dl></div>' +
      '<div class="report-kpis">' +
        '<div class="report-kpi"><span>' + esc(t('evo.first')) + '</span><strong>' + App.fmt(first, 2) + '<small> / 4</small></strong><em>' + esc(App.periodLabel(p.list[0])) + '</em></div>' +
        '<div class="report-kpi main"><span>' + esc(t('evo.latest')) + '</span><strong>' + App.fmt(last, 2) + '<small> / 4</small></strong><em>' + esc(App.periodLabel(p.list[p.list.length - 1])) + '</em></div>' +
        '<div class="report-kpi"><span>' + esc(t('evo.change')) + '</span><strong>' + (first === null || last === null ? '—' : (last - first > 0 ? '+' : '') + App.fmt(last - first, 2)) + '</strong></div>' +
      '</div>' +
      '<p class="report-lead">' + esc(t('evo.summarySentence', {
        org: App.orgName(org), first: App.fmt(first, 2), last: App.fmt(last, 2), from: App.periodLabel(p.list[0]), to: App.periodLabel(p.list[p.list.length - 1]),
        resolved: ch.resolvedWeaknesses.length, newWeak: ch.newWeaknesses.length
      })) + '</p>' +
      '<h3 class="report-h3">' + esc(t('evo.chart')) + '</h3><div id="evo-report-chart"></div>' +
      '<h3 class="report-h3">' + esc(t('evo.table')) + '</h3>' + periodTable(tl, 'report-table compact') +
      '</section>';

    html += '<section class="report-page">' + header(t('evo.compare')) +
      '<p><strong>' + esc(App.assessmentLabel(p.from)) + '</strong> → <strong>' + esc(App.assessmentLabel(p.to)) + '</strong></p>' +
      changesSection(ch, 'report-table compact') + '</section>';

    var bestGain = F.PILLARS.map(function (pl, i) {
      var a0 = tl[0].scores.pillars[i].score, a1 = tl[tl.length - 1].scores.pillars[i].score;
      return { name: L(pl.name), d: a0 === null || a1 === null ? null : a1 - a0 };
    }).filter(function (x) { return x.d !== null; }).sort(function (x, y) { return y.d - x.d; });
    var fu = Evo.planFollowUp(p.from);
    var concl = [t('evo.summarySentence', {
      org: App.orgName(org), first: App.fmt(first, 2), last: App.fmt(last, 2), from: App.periodLabel(p.list[0]), to: App.periodLabel(p.list[p.list.length - 1]),
      resolved: ch.resolvedWeaknesses.length, newWeak: ch.newWeaknesses.length
    })];
    if (bestGain.length > 1) {
      concl.push(t('evo.concPillars', { best: bestGain[0].name, bestD: (bestGain[0].d > 0 ? '+' : '') + App.fmt(bestGain[0].d), worst: bestGain[bestGain.length - 1].name, worstD: (bestGain[bestGain.length - 1].d > 0 ? '+' : '') + App.fmt(bestGain[bestGain.length - 1].d) }));
    }
    if (fu.rate !== null) concl.push(t('evo.concPlan', { period: App.periodLabel(p.from), rate: App.fmt(fu.rate * 100, 0) }));
    concl.push(t('conc.next'));

    html += '<section class="report-page report-last">' + header(t('evo.followUp')) +
      '<h3 class="report-h3">' + esc(App.assessmentLabel(p.from)) + '</h3>' + followUpSection(p.from) +
      '<h3 class="report-h3">' + esc(t('report.conclusion')) + '</h3><div class="conclusion">' + concl.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') + '</div>' +
      '<div class="signatures">' + ['report.preparedBy', 'report.validatedBy'].map(function (k) {
        return '<div class="signature"><span>' + esc(t(k)) + '</span><div class="sig-line"></div><small>' + esc(t('report.signature')) + '</small></div>';
      }).join('') + '</div></section>';

    html += '</div>';
    App.setView(html);
    document.getElementById('evo-report-chart').appendChild(chart(tl, 'report'));
  };

  A['evo-model'] = function (el) {
    App.ui.evoModel = el.dataset.model;
    App.ui.evoFrom = null;
    App.ui.evoTo = null;
    App.render();
  };

  A['evo-from'] = function (el) { App.ui.evoFrom = el.value; App.render(); };
  A['evo-to'] = function (el) { App.ui.evoTo = el.value; App.render(); };
})();

</script>
  <script>window.App.start();</script>
</body>
</html>
