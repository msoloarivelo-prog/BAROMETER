.gantt-name { padding: .25rem .5rem .25rem 0; min-width: 0; }
.gantt-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-sub { display: block; color: var(--muted); font-size: .7rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gantt-track {
  grid-column: 2 / -1;
  display: grid;
  grid-template-columns: repeat(var(--months), 1fr);
  height: 100%;
  align-items: center;
  background-image: linear-gradient(to right, var(--border) 1px, transparent 1px);
  background-size: calc(100% / var(--months)) 100%;
}
.gantt-bar { height: 14px; border-radius: 4px; background: var(--c-other); margin: 0 2px; }
.cat-maintain .gantt-bar { background: var(--c-maintain); }
.cat-opportunity .gantt-bar { background: var(--c-opportunity); }
.cat-address .gantt-bar { background: var(--c-address); }
.status-done .gantt-bar { background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .35) 0 4px, transparent 4px 8px); }
.status-done .gantt-title::after { content: " ✓"; color: var(--ok); }

/* ------------------------------------------------------------ facilitator */

.portfolio td { font-size: .9rem; }
.heat { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.heat-1 { background: var(--l1-bg); color: var(--l1); }
.heat-2 { background: var(--l2-bg); color: #b46d00; }
.heat-3 { background: var(--l3-bg); color: #4f7d1c; }
.heat-4 { background: var(--l4-bg); color: var(--l4); }
.heat-none { color: var(--muted); }
.fac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.fac-grid .card { margin-bottom: 1rem; }
.method { border: 0; padding: 0; margin: 0 0 .8rem; display: grid; gap: .4rem; }
.method legend { font-weight: 600; margin-bottom: .3rem; }
.weights input { width: 5rem; }
.dot { display: inline-block; width: .7rem; height: .7rem; border-radius: 50%; margin-right: .5rem; vertical-align: middle; }

/* ------------------------------------------------------------ models, evidence, CAP */

.model-banner { padding: .55rem .9rem; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); margin-bottom: .8rem; font-size: .9rem; }
.model-banner.kind-performance { border-left-color: #8a4f9e; }
.model-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
.model-card { display: flex; flex-direction: column; gap: .4rem; border-top: 4px solid var(--accent); }
.model-card.kind-performance { border-top-color: #8a4f9e; }
.model-card h2 { margin: .2rem 0; }
.model-card p { margin: 0; color: var(--muted); }
.model-card .actions { margin-top: auto; padding-top: .6rem; }
.item-n { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.6rem; margin-right: .5rem; border-radius: 6px; background: var(--surface-2); font-size: .8rem; }
.component legend { justify-content: flex-start; }
.component legend .component-score { margin-left: auto; }
.statement { margin: 0 0 .6rem; color: var(--muted); font-size: .9rem; font-style: italic; }
.evidence { margin-top: .5rem; font-size: .88rem; }
.evidence summary { cursor: pointer; color: var(--muted); }
.evidence textarea { margin-top: .35rem; }
.evidence.required { padding: .55rem .7rem; border: 1px dashed #8a4f9e; border-radius: 8px; }
.evidence.required.missing { border-color: var(--danger); background: var(--l1-bg); }
.evidence-label { font-weight: 600; font-size: .82rem; color: #8a4f9e; }
.pdf-viewer { position: fixed; inset: 0; z-index: 100; background: rgba(15, 20, 25, .7); display: flex; flex-direction: column; padding: 2vh 3vw; }
.pdf-viewer-bar { display: flex; align-items: center; gap: .6rem; background: var(--surface); padding: .5rem .8rem; border-radius: 8px 8px 0 0; }
.pdf-viewer-bar strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdf-viewer iframe { flex: 1; width: 100%; border: 0; background: #fff; border-radius: 0 0 8px 8px; }
.evidence-files { list-style: none; padding: 0; margin: .4rem 0; display: grid; gap: .3rem; }
.evidence-files li { display: flex; align-items: center; gap: .5rem; }
.pdf-icon { font-size: .65rem; font-weight: 700; color: #fff; background: #c94040; border-radius: 3px; padding: .1rem .3rem; }
.btn.link, button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font: inherit; text-align: left; }
.upload-btn { margin: .3rem 0; }
.profile-next { margin: 0 0 1rem; }
.card h3 { margin: 1.1rem 0 .6rem; font-size: .95rem; color: var(--muted); }
.verified { display: inline-flex; align-items: center; gap: .4rem; margin-top: .35rem; font-size: .85rem; }
.fac-model-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin: 0 0 1rem; }
.portfolio tr.no-assessment td { color: var(--muted); }
.cap-grid { grid-template-columns: 1.2fr 1.6fr 1.2fr 1fr 1fr 1fr; }
.follow-up { margin-top: .5rem; }
.cap-table { table-layout: fixed; }
.cap-table { font-size: 8.5pt; }
.cap-table .gap-cell { background: #fafbfc; }
.cap-table .gap-text { color: #4a5763; }
.cap-table .gap-cell .level-badge { min-width: 1.2rem; height: 1.2rem; font-size: 7.5pt; vertical-align: middle; }
.cap-domain td { background: #eef3f8 !important; color: #2f4f6f; }
.report-donuts.many { grid-template-columns: repeat(5, 1fr); }
.report-donuts.many span { font-size: 8pt; }

/* ------------------------------------------------------------ evolution */

.evo-summary { grid-template-columns: repeat(4, 1fr); }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.segmented button { border: 0; background: var(--surface); color: var(--text); padding: .45rem .8rem; font: inherit; font-size: .9rem; cursor: pointer; }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button.active { background: var(--accent); color: var(--accent-text); }
.evo-selectors { display: flex; flex-wrap: wrap; gap: .6rem 1rem; margin-bottom: .6rem; }
.evo-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; margin-bottom: .6rem; }
.evo-kpi { border: 1px solid var(--border); border-radius: 8px; padding: .6rem .8rem; display: flex; flex-direction: column; }
.evo-kpi strong { font-size: 1.6rem; line-height: 1.1; }
.evo-kpi span { font-size: .8rem; color: var(--muted); }
.evo-kpi.up strong { color: var(--ok); }
.evo-kpi.down strong { color: var(--danger); }
.evo-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: .6rem; }
.evo-list h3 { margin: .4rem 0; display: flex; gap: .5rem; align-items: baseline; }
.evo-list.up h3 { color: var(--ok); }
.evo-list.down h3 { color: var(--danger); }
.evo-list .level-badge { min-width: 1.35rem; height: 1.35rem; font-size: .75rem; }
.period-table td, .period-table th { white-space: nowrap; }
.period-table td:first-child { white-space: normal; }
.done-list { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; }
.lines-wrap { width: 100%; }
.chart-lines { width: 100%; height: auto; display: block; }
.chart-lines .grid { stroke: var(--border); stroke-width: 1; }
.chart-lines .axis { fill: var(--muted); font-size: 12px; }
.chart-lines .point-value { font-size: 12px; font-weight: 700; }
.chart-legend { display: flex; flex-wrap: wrap; gap: .4rem 1.1rem; font-size: .85rem; margin-top: .3rem; }
.chart-legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: .4rem; vertical-align: middle; }
.report .evo-kpi strong { font-size: 15pt; }
.report .evo-kpis { gap: 2mm; }
.report .evo-columns { gap: 4mm; }
.report .evo-list h3 { font-size: 10.5pt; }
.report .chart-lines .axis { font-size: 11px; }

/* ------------------------------------------------------------ report (screen = A4 preview) */

.report { display: grid; gap: 1.5rem; justify-content: center; }
.report-page {
  width: 210mm;
  min-height: 297mm;
  padding: 16mm 15mm;
  background: #fff;
  color: #1d2733;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
  font-size: 10.5pt;
  line-height: 1.45;
  --muted: #5d6b7a;
  --border: #d8dfe6;
  --surface: #fff;
  --surface-2: #eef2f5;
  --text: #1d2733;
}
.report-page .muted { color: #5d6b7a; }
.report-cover { padding-bottom: 6mm; margin-bottom: 6mm; border-bottom: 3px solid var(--accent); }
.report-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 8.5pt; color: var(--accent); font-weight: 700; }
.report-cover h1 { font-size: 21pt; margin: .2rem 0 .4rem; }
.report-org { font-size: 15pt; font-weight: 600; }
.report-org span { color: #5d6b7a; font-weight: 400; }
.report-facts { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: .3rem 2rem; margin: .8rem 0 0; }
.report-facts dt { font-size: 8pt; text-transform: uppercase; color: #5d6b7a; letter-spacing: .04em; }
.report-facts dd { margin: 0; font-weight: 600; }
.report-h { font-size: 13pt; margin: 0 0 .6rem; }
.report-h3 { font-size: 11.5pt; margin: 1.1rem 0 .5rem; padding-bottom: .2rem; border-bottom: 1px solid #d8dfe6; }
.report-h3.pillar { border-bottom: 2px solid var(--pillar); display: flex; justify-content: space-between; }
.report-h3.cat-maintain { color: var(--c-maintain); }
.report-h3.cat-opportunity { color: var(--c-opportunity); }
.report-h3.cat-address { color: var(--c-address); }
.report-kpis { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 4mm; }
.report-kpi { border: 1px solid #d8dfe6; border-radius: 8px; padding: 3mm 4mm; display: flex; flex-direction: column; gap: .1rem; }
.report-kpi span { font-size: 8pt; text-transform: uppercase; color: #5d6b7a; letter-spacing: .04em; }
.report-kpi strong { font-size: 20pt; line-height: 1.1; }
.report-kpi strong small { font-size: 10pt; color: #5d6b7a; font-weight: 500; }
.report-kpi em { font-style: normal; font-size: 9pt; color: #5d6b7a; }
.report-kpi.main { background: #f4f8fb; border-color: var(--accent); }
.report-kpi .delta { margin-left: 0; }
.report-lead { margin: 4mm 0; font-size: 11pt; }
.report-donuts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3mm; text-align: center; }
.report-donut { color: var(--pillar); }
.report-donut span { display: block; color: #1d2733; font-weight: 600; font-size: 9.5pt; margin-top: .2rem; }
.report-swot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; break-inside: avoid; }
.report-swot-col { border-radius: 8px; padding: 3mm; border-top: 3px solid; }
.report-swot-col.cat-maintain { background: #f2f9f5; border-top-color: var(--c-maintain); }
.report-swot-col.cat-opportunity { background: #f1f6fb; border-top-color: var(--c-opportunity); }
.report-swot-col.cat-address { background: #fcf2f2; border-top-color: var(--c-address); }
.report-swot-col h4 { margin: 0 0 .4rem; font-size: 10pt; display: flex; justify-content: space-between; }
.report-top { list-style: none; padding: 0; margin: 0; display: grid; gap: .3rem; font-size: 9.5pt; }
.report-top li { display: grid; grid-template-columns: auto 1fr; gap: .35rem; align-items: start; }
.report-top li small { display: block; color: #5d6b7a; font-size: 7.5pt; }
.report-top li.muted { display: block; }
.report-gantt-title { break-before: page; }
.report-top .level-badge { min-width: 1.25rem; height: 1.25rem; font-size: 7.5pt; }
.report-plan-counts { display: flex; flex-wrap: wrap; gap: .4rem; }
.report-pillar-bars { margin-bottom: 2mm; }

.report-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
.report-table th, .report-table td { border-bottom: 1px solid #e3e8ed; padding: 1.6mm 2mm; text-align: left; vertical-align: top; }
.report-table th { font-size: 7.5pt; text-transform: uppercase; color: #5d6b7a; letter-spacing: .04em; background: #f6f8fa; }
.report-table .aspect-cell { background: #fafbfc; width: 30%; }
.report-table .level-badge { min-width: 1.35rem; height: 1.35rem; font-size: 8pt; }
.report-table tr.total td { font-weight: 700; border-top: 2px solid #d8dfe6; }
.report-table.compact td { padding: 1.2mm 2mm; }
.cat-dot { font-size: 8pt; }
.cat-dot.cat-maintain { color: var(--c-maintain); }
.cat-dot.cat-opportunity { color: var(--c-opportunity); }
.cat-dot.cat-address { color: var(--c-address); }
.cat-dot.cat-other { color: var(--c-other); }
.own-mark { display: inline-block; font-size: 7.5pt; color: var(--c-other); border: 1px solid var(--c-other); border-radius: 999px; padding: 0 .35rem; }
.report-items { display: grid; gap: 2.5mm; }
.report-item { border-left: 3px solid; padding: 1mm 0 1mm 3mm; break-inside: avoid; }
.report-item.cat-maintain { border-left-color: var(--c-maintain); }
.report-item.cat-opportunity { border-left-color: var(--c-opportunity); }
.report-item.cat-address { border-left-color: var(--c-address); }
.report-item-head { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.report-item p { margin: .15rem 0; font-size: 9.5pt; }
.report-item em { color: #5d6b7a; }
.report-item .level-badge { min-width: 1.3rem; height: 1.3rem; font-size: 8pt; }
.report-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; border-bottom: 2px solid var(--accent); padding-bottom: 2mm; margin-bottom: 4mm; }
.report-header h2 { margin: .1rem 0 0; font-size: 15pt; }
.report-meta { text-align: right; font-size: 8.5pt; color: #5d6b7a; }
.report .gantt-chart { --name-w: 50mm; min-width: 0; font-size: 7.5pt; }
.report .gantt-month { font-size: 6pt; }
.report .gantt-year { font-size: 7pt; padding: .5mm 0; }
.report .gantt-line { min-height: 6mm; break-inside: avoid; }
.report .gantt-bar { height: 3mm; }
.signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 12mm; margin-top: 12mm; }
.signature span { font-weight: 600; }
.sig-line { border-bottom: 1px solid #1d2733; height: 22mm; }
.signature small { color: #5d6b7a; }

/* ------------------------------------------------------------ report: light palette and layout */

.report {
  --l1: #f4b9b6;
  --l2: #f7d8a2;
  --l3: #cfe6ad;
  --l4: #a9d9bd;
  --accent: #5b8db5;
}
.report .level-badge { color: #1d2733; font-weight: 600; }
.report .report-cover { border-bottom: 2px solid #c9dcec; }
.report .report-header { border-bottom: 1.5px solid #c9dcec; }
.report .report-kpi.main { background: #f5f9fc; border-color: #c9dcec; }
.report .report-h3 { border-bottom-color: #e6ecf1; }
.report .report-h3.pillar { border-bottom: 2px solid var(--pillar); }
.report .report-h3.cat-maintain, .report .ffom-group.cat-maintain td { color: #2f7d55; }
.report .report-h3.cat-opportunity, .report .ffom-group.cat-opportunity td { color: #2f6f9f; }
.report .report-h3.cat-address, .report .ffom-group.cat-address td { color: #b2504b; }
.report .report-swot-col.cat-maintain { border-top-color: #a9d9bd; background: #f6fbf8; }
.report .report-swot-col.cat-opportunity { border-top-color: #a9cdea; background: #f5f9fd; }
.report .report-swot-col.cat-address { border-top-color: #f4b9b6; background: #fdf6f5; }
.report .bar-fill { opacity: .9; }
.report .gantt-bar { background: #d6c6ea; }
.report .cat-maintain .gantt-bar { background: #a9d9bd; }
.report .cat-opportunity .gantt-bar { background: #a9cdea; }
.report .cat-address .gantt-bar { background: #f4b9b6; }
.report .status-done .gantt-bar { background-image: repeating-linear-gradient(45deg, rgba(255, 255, 255, .6) 0 3px, transparent 3px 6px); }

.ffom-table, .plan-table { table-layout: fixed; }
.ffom-table .c-comp { width: 22%; }
.ffom-table .c-score { width: 7%; }
.ffom-table .c-sit, .ffom-table .c-target { width: 35.5%; }
.ffom-table.with-notes .c-sit, .ffom-table.with-notes .c-target { width: 26%; }
.ffom-table.with-notes .c-notes { width: 19%; }
.ffom-group td { background: #f6f8fa; font-size: 9.5pt; padding-top: 2.5mm !important; }
.ffom-group.cat-maintain td { background: #f1f9f4; }
.ffom-group.cat-opportunity td { background: #f0f6fc; }
.ffom-group.cat-address td { background: #fdf2f1; }
.ffom-group span { font-weight: 400; color: #5d6b7a; font-size: 8.5pt; }

.report-page.landscape { width: 297mm; min-height: 210mm; }
.report .landscape .gantt-chart { --name-w: 80mm; font-size: 8pt; }
.report .landscape .gantt-title { white-space: normal; line-height: 1.25; }
.report .landscape .gantt-line { min-height: 7mm; }
.gantt-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 8pt; }
.gantt-table .gt-name { width: 78mm; }
.gantt-table th { font-weight: 600; color: #5d6b7a; text-align: center; padding: .8mm 0; border-left: 1px solid #e3e8ed; }
.gantt-table .gt-years th { background: #f3f6f9; font-size: 8pt; border-left: 1.5px solid #9aa8b6; }
.gantt-table .gt-months th { font-size: 6.5pt; font-weight: 500; border-bottom: 1px solid #d8dfe6; }
.gantt-table td { border-left: 1px solid #eef2f5; border-bottom: 1px solid #eef2f5; padding: 0; height: 7mm; }
.gantt-table td.gt-label { border-left: 0; padding: 1mm 2mm 1mm 0; line-height: 1.25; }
.gantt-table tr { break-inside: avoid; }
.gantt-table .gantt-title { display: block; }
.gantt-table .gantt-sub { display: block; color: #5d6b7a; font-size: 7pt; }
.gantt-table .gt-span { padding: 0 1px; }
.gantt-table .gantt-bar { height: 3.2mm; border-radius: 3px; margin: 0; }
.gantt-legend { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: 8.5pt; margin-bottom: 3mm; color: #5d6b7a; }
.gantt-legend i { display: inline-block; width: 18px; height: 8px; border-radius: 3px; margin-right: .35rem; vertical-align: middle; background: #d6c6ea; }
.gantt-legend .cat-maintain i { background: #a9d9bd; }
.gantt-legend .cat-opportunity i { background: #a9cdea; }
.gantt-legend .cat-address i { background: #f4b9b6; }
.gantt-legend .status-done i { background: #ccc repeating-linear-gradient(45deg, rgba(255, 255, 255, .7) 0 3px, transparent 3px 6px); }

.conclusion p { margin: 0 0 3mm; font-size: 10.5pt; text-align: justify; }
.fac-note { width: 100%; font: inherit; font-size: 10pt; }
.print-only { display: none; }
.keep-together { break-inside: avoid; }

/* ------------------------------------------------------------ responsive */

@media (max-width: 1000px) {
  .activity-grid, .cap-grid { grid-template-columns: 1fr 1fr 1fr; }
  .activity-grid .field:first-child { grid-column: 1 / -1; }
}

@media (max-width: 900px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .fac-summary, .evo-summary { grid-template-columns: 1fr 1fr; }
  .evo-kpis { grid-template-columns: repeat(3, 1fr); }
  .evo-columns { grid-template-columns: 1fr; }
  .kpi-wide { grid-column: 1 / -1; }
  .pillar-grid, .swot-grid, .fac-grid { grid-template-columns: 1fr; }
  .levels { grid-template-columns: repeat(2, 1fr); }
  .level-header { display: none; }
  .main-nav a.nav-facilitator { margin-left: 0; }
  .report { display: block; }
  .report-page, .report-page.landscape { width: auto; min-height: 0; padding: 6mm 5mm; margin-bottom: 1rem; overflow-x: auto; }
}

@media (max-width: 600px) {
  .app-header { position: static; }
  .context-switch { flex: 1 1 100%; width: 100%; min-width: 0; order: 3; }
  .context-switch label { flex: 1 1 140px; min-width: 0; }
  .context-switch select { min-width: 0; max-width: 100%; width: 100%; }
  .context-switch .btn { flex: 1 1 100%; justify-content: center; }
  .inline-field { flex-wrap: wrap; max-width: 100%; }
  .inline-field select { min-width: 0; max-width: 100%; }
  .summary, .fac-summary, .evo-summary { grid-template-columns: 1fr; }
  .evo-kpis { grid-template-columns: 1fr 1fr; }
  .levels { grid-template-columns: 1fr; }
  .pillar-body { flex-direction: column; align-items: stretch; }
  .donut-slot { align-self: center; }
  .activity-grid, .cap-grid, .activity-more .activity-grid { grid-template-columns: 1fr 1fr; }
  .report-kpis, .report-swot { grid-template-columns: 1fr; }
  .report-donuts { grid-template-columns: 1fr 1fr; }
  .report-facts { grid-template-columns: 1fr 1fr; }
  .gantt-chart { --name-w: 140px; }
}

/* ------------------------------------------------------------ print / PDF */

@page { size: A4; margin: 12mm; }
@page landscape { size: A4 landscape; margin: 10mm; }

@media print {
  :root { --surface: #fff; --surface-2: #eef2f5; --text: #1d2733; --muted: #5d6b7a; --border: #d8dfe6; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .app-header, .app-footer, .no-print, .pillar-tabs, .pager, .flash { display: none !important; }
  body { background: #fff; color: #000; font-size: 10pt; }
  main { max-width: none; padding: 0; }
  .card, .kpi { box-shadow: none; break-inside: avoid; }
  .report { display: block; }
  .report-page { width: auto; min-height: 0; padding: 0; box-shadow: none; break-after: page; }

/* js/models.js */
/*
 * Assessment models.
 *
 * The same engine (1-4 levels, scoring, strengths/opportunities/weaknesses,
 * change action plan, progress over time, reports) runs several models:
 *
 *   barometer : the original governance barometer (4 pillars, 33 components)
 *   itoca     : ITOCA / OCA capacity assessment (10 domains, 94 indicators)
 *   opi       : Organisational Performance Index (5 domains, 10 sub-domains)
 *
 * Each model exposes the same shape as framework.js
 * ({ LEVELS, MAX_SCORE, PRIORITIES, SEQUENCES, PILLARS, allComponents }) plus
 * metadata. An assessment records its model in `assessment.model`.
 */
(function (root) {
  'use strict';

  var isNode = typeof module !== 'undefined' && module.exports;
  var Base = isNode ? require('./framework.js') : root.BarometerFramework;
  var Activities = isNode ? require('./activities.js') : root.BarometerActivities;
  var ItocaData = isNode ? require('./models/itoca-data.js') : root.BarometerItocaData;
  var OpiData = isNode ? require('./models/opi-data.js') : root.BarometerOpiData;

  var DEFAULT_MODEL = 'barometer';

  // Ten distinguishable colours (strong for the screen, light for printed reports).
  var PALETTE = ['#2f6f9f', '#3f8f5f', '#c9822b', '#8a4f9e', '#b5473f', '#2a8c8c', '#7a6a2f', '#5b5fb0', '#b0477f', '#4f7d2a'];
  var PALETTE_LIGHT = ['#7fb0d6', '#86c49c', '#ecb877', '#b99ad0', '#e39a94', '#86c9c9', '#cbb978', '#a3a6de', '#dd98bc', '#a2c77e'];
  var BAROMETER_COLORS = { gov: ['#2f6f9f', '#7fb0d6'], plan: ['#3f8f5f', '#86c49c'], hr: ['#c9822b', '#ecb877'], fin: ['#8a4f9e', '#b99ad0'] };

  function model(def) {
    var fw = {
      id: def.id,
      name: def.name,
      shortName: def.shortName,
      description: def.description,
      kind: def.kind,
      flat: !!def.flat,
      indexMethod: def.indexMethod,
      evidence: def.evidence || 'optional',
      minYears: def.minYears || 0,
      autoCategories: def.autoCategories || null,
      LEVELS: Base.LEVELS,
      MAX_SCORE: Base.MAX_SCORE,
      PRIORITIES: Base.PRIORITIES,
      SEQUENCES: Base.SEQUENCES,
      PILLARS: def.pillars
    };
    fw.allComponents = function () {
      var list = [];
      fw.PILLARS.forEach(function (p) {
        p.aspects.forEach(function (a) {
          a.components.forEach(function (c) { list.push({ pillar: p, aspect: a, component: c }); });
        });
      });
      return list;
    };
    return fw;
  }

  /** Turns flat domain data ({ id, name, shortName, items[] }) into pillars with a single aspect. */
  function domainsToPillars(domains, registerActions) {
    return domains.map(function (d, i) {
      var components = d.items.map(function (it) {
        registerActions(it);
        return { id: it.id, name: it.name, statement: it.statement, levels: it.levels };
      });
      return {
        id: d.id,
        name: d.name,
        shortName: d.shortName,
        color: PALETTE[i % PALETTE.length],
        reportColor: PALETTE_LIGHT[i % PALETTE_LIGHT.length],
        aspects: [{ id: d.id + '-items', name: d.name, components: components }]
      };
    });
  }

  function fill(str, name) { return { fr: str.fr.replace('{name}', name.fr), en: str.en.replace('{name}', name.en) }; }

  var GENERIC = {
    maintain: { fr: 'Maintenir et documenter la bonne pratique, avec une revue annuelle : {name}', en: 'Maintain and document the good practice, with an annual review: {name}' },
    upIndicator: { fr: 'Au moins un niveau de plus sur « {name} » au prochain diagnostic', en: 'At least one level higher on “{name}” at the next assessment' },
    keepIndicator: { fr: 'Niveau 4 maintenu sur « {name} »', en: 'Level 4 kept on “{name}”' },
    reviewVerification: { fr: 'Compte rendu de la revue annuelle', en: 'Annual review minutes' }
  };

  /** ITOCA: one specific action per indicator, plus generic coaching and maintenance actions. */
  function itocaActions(it) {
    var up = fill(GENERIC.upIndicator, it.name);
    var specific = { title: it.action, indicator: up, verification: it.verification };
    Activities.register(it.id, {
      address: [specific],
      opportunity: [specific],
      maintain: [{ title: fill(GENERIC.maintain, it.name), indicator: fill(GENERIC.keepIndicator, it.name), verification: GENERIC.reviewVerification }]
    });
  }

  /** OPI: one specific action per category. */
  function opiActions(it) {
    var up = fill(GENERIC.upIndicator, it.name);
    Activities.register(it.id, {
      address: [{ title: it.actions.address, indicator: up, verification: it.verification }],
      opportunity: [{ title: it.actions.opportunity, indicator: up, verification: it.verification }],
      maintain: [{ title: it.actions.maintain, indicator: fill(GENERIC.keepIndicator, it.name), verification: it.verification }]
    });
  }

  var registry = {};

  Base.PILLARS.forEach(function (p) {
    p.color = BAROMETER_COLORS[p.id][0];
    p.reportColor = BAROMETER_COLORS[p.id][1];
  });

  registry.barometer = model({
    id: 'barometer',
    name: { fr: 'Baromètre de gouvernance', en: 'Governance barometer' },
    shortName: { fr: 'Baromètre', en: 'Barometer' },
    description: { fr: 'Diagnostic de gouvernance : 4 piliers, 33 composantes.', en: 'Governance assessment: 4 pillars, 33 components.' },
    kind: 'capacity',
    indexMethod: 'components',
    pillars: Base.PILLARS
  });

  registry.itoca = model({
    id: 'itoca',
    name: { fr: 'ITOCA – Évaluation intégrée des capacités techniques et organisationnelles', en: 'ITOCA – Integrated technical and organisational capacity assessment' },
    shortName: { fr: 'ITOCA', en: 'ITOCA' },
    description: {
      fr: 'Capacités (dérivé de l’OCA/OCAT) : 10 domaines, 94 indicateurs. Indice global = moyenne des domaines.',
      en: 'Capacity (derived from OCA/OCAT): 10 domains, 94 indicators. Global index = mean of domains.'
    },
    kind: 'capacity',
    flat: true,
    indexMethod: 'pillars',
    autoCategories: ['address', 'opportunity'],
    pillars: domainsToPillars(ItocaData || [], itocaActions)
  });

  registry.opi = model({
    id: 'opi',
    name: { fr: 'OPI – Indice de performance organisationnelle', en: 'OPI – Organisational performance index' },
    shortName: { fr: 'OPI', en: 'OPI' },
    description: {
      fr: 'Performance (résultats obtenus) : 5 domaines, 10 sous-domaines, preuves obligatoires. Pour les organisations ayant au moins 2 ans d’activités.',
      en: 'Performance (results achieved): 5 domains, 10 sub-domains, evidence required. For organisations with at least 2 years of activity.'
    },
    kind: 'performance',
    flat: true,
    indexMethod: 'pillars',
    evidence: 'required',
    minYears: 2,
    autoCategories: ['address', 'opportunity'],
    pillars: domainsToPillars(OpiData || [], opiActions)
  });

  var ORDER = ['barometer', 'itoca', 'opi'];

  function get(id) { return registry[id] || registry[DEFAULT_MODEL]; }
  function list() { return ORDER.map(function (id) { return registry[id]; }); }
  function exists(id) { return !!registry[id]; }

  /** Finds a component in any model (ids are unique across models). */
  function findComponent(id) {
    for (var i = 0; i < ORDER.length; i++) {
      var hit = registry[ORDER[i]].allComponents().filter(function (e) { return e.component.id === id; })[0];
      if (hit) return hit;
    }
    return null;
  }

  /** Scoring settings for a model: user weights only apply to the barometer. */
  function scoringSettings(fw, settings) {
    if (fw.indexMethod === 'pillars') return { indexMethod: 'weighted', weights: {} };
    return settings;
  }

  var Models = {
    DEFAULT_MODEL: DEFAULT_MODEL,
    get: get,
    list: list,
    exists: exists,
    findComponent: findComponent,
    scoringSettings: scoringSettings
  };

  if (isNode) {
    module.exports = Models;
  } else {
    root.BarometerModels = Models;
  }
})(this);

  <script>
/* js/scoring.js */
/*
 * Scoring engine.
 *
 * Reproduces the hidden "Fiche de Calculs" sheet of the Excel workbook:
 *   - component : level chosen (1 to 4);
 *   - aspect    : mean of its components (e.g. D19 = AVERAGE(D16:D18));
 *   - pillar    : mean of its aspects (e.g. D81 = AVERAGE(D19,D21,D23,D27));
 *   - total     : sum of the 33 components (D74);
 *   - mean development index: mean of the 33 components (D76).
 *
 * Global index method (workspace setting):
 *   'components' (default, as in Excel): mean of all components. Pillars with
 *     more components weigh more (Governance 7/33, Planning 13/33, HR 5/33,
 *     Finance 8/33).
 *   'weighted': weighted mean of pillar scores using explicit weights
 *     (e.g. 25 % each).
 *
 * Deliberate difference from Excel: unanswered components are ignored in the
 * means (Excel showed #DIV/0! or counted zeros).
 */
(function (root) {
  'use strict';

  var CATEGORIES = ['maintain', 'opportunity', 'address'];

  function average(values) {
    var present = values.filter(function (v) { return typeof v === 'number' && !isNaN(v); });
    if (present.length === 0) return null;
    return present.reduce(function (a, b) { return a + b; }, 0) / present.length;
  }

  function isValidLevel(value, maxScore) {
    return typeof value === 'number' && value >= 1 && value <= maxScore && Math.floor(value) === value;
  }

  /** Strength to maintain (4), opportunity to catch (3), weakness to address (1-2). */
  function categoryFor(score, maxScore) {
    maxScore = maxScore || 4;
    if (score === null || score === undefined) return null;
    if (score >= maxScore) return 'maintain';
    if (score >= maxScore - 1) return 'opportunity';
    return 'address';
  }

  /** Effective share of each pillar in the global index, in percent. */
  function effectiveWeights(framework, settings) {
    var method = settings && settings.indexMethod === 'weighted' ? 'weighted' : 'components';
    var out = {};
    if (method === 'components') {
      var counts = framework.PILLARS.map(function (p) {
        return p.aspects.reduce(function (n, a) { return n + a.components.length; }, 0);
      });
      var total = counts.reduce(function (a, b) { return a + b; }, 0);
      framework.PILLARS.forEach(function (p, i) { out[p.id] = (counts[i] / total) * 100; });
    } else {
      var w = normalizedWeights(framework, settings.weights);
      framework.PILLARS.forEach(function (p) { out[p.id] = w[p.id] * 100; });
    }
    return out;
  }

  function normalizedWeights(framework, weights) {
    var raw = {};
    var sum = 0;
    framework.PILLARS.forEach(function (p) {
      var v = weights && Number(weights[p.id]);
      raw[p.id] = v > 0 ? v : 0;
      sum += raw[p.id];
    });
    framework.PILLARS.forEach(function (p) {
      raw[p.id] = sum > 0 ? raw[p.id] / sum : 1 / framework.PILLARS.length;
    });
    return raw;
  }

  /**
   * Computes every score of an assessment.
   * @param {object} framework  see framework.js
   * @param {object} answers    { componentId: level 1..4 }
   * @param {object} [settings] { indexMethod: 'components'|'weighted', weights: {pillarId: number} }
   */
  function computeScores(framework, answers, settings) {
    answers = answers || {};
    var max = framework.MAX_SCORE;
    var allScores = [];
    var answeredCount = 0;
    var totalCount = 0;
    var counts = { maintain: 0, opportunity: 0, address: 0 };

    var pillars = framework.PILLARS.map(function (pillar) {
      var pillarAnswered = 0;
      var pillarTotal = 0;
      var aspects = pillar.aspects.map(function (aspect) {
        var components = aspect.components.map(function (component) {
          var raw = answers[component.id];
          var score = isValidLevel(raw, max) ? raw : null;
          totalCount++;
          pillarTotal++;
          if (score !== null) {
            answeredCount++;
            pillarAnswered++;
            allScores.push(score);
            counts[categoryFor(score, max)]++;
          }
          return { id: component.id, name: component.name, score: score, category: categoryFor(score, max) };
        });
        var aspectScore = average(components.map(function (c) { return c.score; }));
        return { id: aspect.id, name: aspect.name, score: aspectScore, components: components };
      });
      var pillarScore = average(aspects.map(function (a) { return a.score; }));
      return {
        id: pillar.id,
        name: pillar.name,
        shortName: pillar.shortName,
        color: pillar.color,
        reportColor: pillar.reportColor,
        score: pillarScore,
        percent: pillarScore === null ? null : (pillarScore / max) * 100,
        answered: pillarAnswered,
        total: pillarTotal,
        aspects: aspects
      };
    });

    var componentIndex = average(allScores);

    // Weighted mean of pillar scores, re-normalised over pillars that have a score.
    var weights = normalizedWeights(framework, settings && settings.weights);
    var wSum = 0;
    var wTotal = 0;
    pillars.forEach(function (p) {
      if (p.score !== null) { wSum += p.score * weights[p.id]; wTotal += weights[p.id]; }
    });
    var weightedIndex = wTotal > 0 ? wSum / wTotal : null;

    var method = settings && settings.indexMethod === 'weighted' ? 'weighted' : 'components';
    var index = method === 'weighted' ? weightedIndex : componentIndex;

    return {
      maxScore: max,
      pillars: pillars,
      total: allScores.reduce(function (a, b) { return a + b; }, 0),
      maxTotal: totalCount * max,
      index: index,
      indexMethod: method,
      componentIndex: componentIndex,
      weightedIndex: weightedIndex,
      indexPercent: index === null ? null : (index / max) * 100,
      answered: answeredCount,
      totalComponents: totalCount,
      completion: totalCount ? answeredCount / totalCount : 0,
      complete: answeredCount === totalCount,
      counts: counts
    };
  }

  /** Compares two assessments (Excel "Score 1 / Score 2 / Changement"). */
  function compareScores(current, baseline) {
    function diff(a, b) {
      return a === null || b === null || a === undefined || b === undefined ? null : a - b;
    }
    return {
      index: diff(current.index, baseline.index),
      total: diff(current.total, baseline.total),
      pillars: current.pillars.map(function (p, i) {
        var bp = baseline.pillars[i];
        return {
          id: p.id,
          delta: diff(p.score, bp.score),
          aspects: p.aspects.map(function (a, j) {
            return { id: a.id, delta: diff(a.score, bp.aspects[j].score) };
          })
        };
      })
    };
  }

  /**
   * Groups answered components into strengths to maintain, opportunities to
   * catch and weaknesses to address. Each list is sorted (weakest first for
   * weaknesses).
   */
  function classify(framework, answers) {
    var groups = { maintain: [], opportunity: [], address: [] };
    framework.PILLARS.forEach(function (pillar) {
      pillar.aspects.forEach(function (aspect) {
        aspect.components.forEach(function (component) {
          var score = answers[component.id];
          if (!isValidLevel(score, framework.MAX_SCORE)) return;
          groups[categoryFor(score, framework.MAX_SCORE)].push({
            pillar: pillar,
            aspect: aspect,
            component: component,
            score: score
          });
        });
      });
    });
    groups.address.sort(function (a, b) { return a.score - b.score; });
    return groups;
  }

  /** Development stage for a mean score. */
  function stageFor(framework, score) {
    if (score === null || score === undefined) return null;
    var idx = Math.min(framework.LEVELS.length, Math.max(1, Math.round(score))) - 1;
    return framework.LEVELS[idx];
  }

  var Scoring = {
    CATEGORIES: CATEGORIES,
    average: average,
    categoryFor: categoryFor,
    effectiveWeights: effectiveWeights,
    computeScores: computeScores,
    compareScores: compareScores,
    classify: classify,
    stageFor: stageFor
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = Scoring;
  } else {
    root.BarometerScoring = Scoring;
  }
})(this);

(function (root) {

    Object.keys(wanted).forEach(function (key) {

/* js/files.js */
/*
 * Evidence files (PDF) stored in the browser's IndexedDB.
 *
 * Assessments only keep metadata ({ id, name, size, uploadedAt } per
 * indicator in `assessment.evidenceFiles`); the PDF content lives in
 * IndexedDB, which allows much larger storage than localStorage.
 * Organisation exports and workspace backups embed the files (base64) so
 * they travel with the data to the facilitator.
 */
(function (root) {
  'use strict';

  var DB_NAME = 'barometre-files';
  var STORE = 'files';
  var MAX_SIZE = 10 * 1024 * 1024; // 10 MB per file
  var dbPromise = null;

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!root.indexedDB) { reject(new Error('indexeddb-unavailable')); return; }
      var req = root.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(STORE, { keyPath: 'id' }); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  function tx(mode, fn) {
    return open().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var store = t.objectStore(STORE);
        var result = fn(store);
        t.oncomplete = function () { resolve(result && result.result !== undefined ? result.result : result); };
        t.onerror = function () { reject(t.error); };
      });
    });
  }

  function uid() { return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /** Checks that a File is a PDF (extension/type and "%PDF" signature) and not too large. */
  function validatePdf(file) {
    return new Promise(function (resolve, reject) {
      var looksPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
      if (!looksPdf) { reject(new Error('not-pdf')); return; }
      if (file.size > MAX_SIZE) { reject(new Error('too-large')); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var sig = new Uint8Array(reader.result);
        if (String.fromCharCode(sig[0], sig[1], sig[2], sig[3]) !== '%PDF') reject(new Error('not-pdf'));
        else resolve();
      };
      reader.onerror = function () { reject(new Error('not-pdf')); };
      reader.readAsArrayBuffer(file.slice(0, 4));
    });
  }

  /** Stores a PDF and returns its metadata. */
  function add(file) {
    return validatePdf(file).then(function () {
      var meta = { id: uid(), name: file.name, size: file.size, uploadedAt: new Date().toISOString() };
      var record = { id: meta.id, name: meta.name, size: meta.size, type: 'application/pdf', uploadedAt: meta.uploadedAt, data: file };
      return tx('readwrite', function (s) { s.put(record); }).then(function () { return meta; });
    });
  }

  function get(id) {
    return tx('readonly', function (s) { return s.get(id); });
  }

  function remove(id) {
    return tx('readwrite', function (s) { s['delete'](id); });
  }

  /**
   * Shows a stored PDF in an in-page viewer (works offline and from file://,
   * where opening blob URLs in a new tab is blocked) with a download button.
   */
  function view(id, labels) {
    return get(id).then(function (rec) {
      if (!rec) throw new Error('missing');
      var url = URL.createObjectURL(new Blob([rec.data], { type: 'application/pdf' }));
      var overlay = document.createElement('div');
      overlay.className = 'pdf-viewer';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      var bar = document.createElement('div');
      bar.className = 'pdf-viewer-bar';
      var title = document.createElement('strong');
      title.textContent = rec.name;
      var dl = document.createElement('a');
      dl.className = 'btn small';
      dl.href = url;
      dl.download = rec.name;
      dl.textContent = '⤓ ' + labels.download;
      var close = document.createElement('button');
      close.className = 'btn small';
      close.type = 'button';
      close.textContent = '✕ ' + labels.close;
      var frame = document.createElement('iframe');
      frame.src = url;
      frame.title = rec.name;
      bar.appendChild(title);
      bar.appendChild(dl);
      bar.appendChild(close);
      overlay.appendChild(bar);
      overlay.appendChild(frame);
      function done() {
        overlay.remove();
        URL.revokeObjectURL(url);
        document.removeEventListener('keydown', onKey);
      }
      function onKey(e) { if (e.key === 'Escape') done(); }
      close.addEventListener('click', done);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) done(); });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      close.focus();
    });
  }

  function blobToBase64(blob) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result).split(',')[1] || ''); };
      reader.onerror = function () { reject(reader.error); };
      reader.readAsDataURL(blob);
    });
  }

  function base64ToBlob(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: 'application/pdf' });
  }

  /** File ids referenced by organisations. */
  function idsOf(orgs) {
    var ids = [];
    orgs.forEach(function (o) {
      o.assessments.forEach(function (a) {
        Object.keys(a.evidenceFiles || {}).forEach(function (cid) {
          a.evidenceFiles[cid].forEach(function (f) { ids.push(f.id); });
        });
      });
    });
    return ids;
  }

  /** Embeds the referenced files (base64) for export. Missing files are skipped. */
  function exportFiles(orgs) {
    return Promise.all(idsOf(orgs).map(function (id) {
      return get(id).then(function (rec) {
        if (!rec) return null;
        return blobToBase64(rec.data).then(function (b64) {
          return { id: rec.id, name: rec.name, size: rec.size, uploadedAt: rec.uploadedAt, data: b64 };
        });
      })['catch'](function () { return null; });
    })).then(function (list) { return list.filter(Boolean); });
  }

  /** Restores embedded files from an import. */
  function importFiles(list) {
    if (!Array.isArray(list) || !list.length) return Promise.resolve(0);
    return tx('readwrite', function (s) {
      list.forEach(function (f) {
        if (!f || typeof f.id !== 'string' || typeof f.data !== 'string') return;
        s.put({ id: f.id, name: String(f.name || 'evidence.pdf'), size: Number(f.size) || 0, type: 'application/pdf', uploadedAt: f.uploadedAt || '', data: base64ToBlob(f.data) });
      });
    }).then(function () { return list.length; });
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' o';
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' Ko';
    return (bytes / (1024 * 1024)).toFixed(1) + ' Mo';
  }

  root.BarometerFiles = {
    MAX_SIZE: MAX_SIZE,
    add: add,
    get: get,
    remove: remove,
    view: view,
    exportFiles: exportFiles,
    importFiles: importFiles,
    idsOf: idsOf,
    formatSize: formatSize
  };
})(this);

/* js/charts.js */
/*
 * Dependency-free SVG/HTML charts (the tool must work offline).
 * Reproduces the Excel dashboard charts (one donut per pillar, bars per
 * aspect) and adds a Gantt timeline for the workplan.
 */
(function (root) {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function el(name, attrs, text) {
    var node = document.createElementNS(SVG_NS, name);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function lang() {
    return root.BarometerI18n ? root.BarometerI18n.getLang() : 'fr';
  }

  function fmt(value, digits) {
    if (value === null || value === undefined || isNaN(value)) return '—';
    var s = value.toFixed(digits === undefined ? 1 : digits);
    return lang() === 'fr' ? s.replace('.', ',') : s;
  }

  /** Donut: score / max with the value in the centre. */
  function donut(score, max, options) {
    options = options || {};
    var size = options.size || 150;
    var stroke = options.stroke || 16;
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var ratio = score === null ? 0 : Math.max(0, Math.min(1, score / max));
    var cx = size / 2;

    var svg = el('svg', {
      viewBox: '0 0 ' + size + ' ' + size,
      width: size,
      height: size,
      class: 'chart-donut',
      role: 'img',
      'aria-label': (options.label || '') + ' ' + fmt(score) + ' / ' + max
    });
    svg.appendChild(el('circle', { cx: cx, cy: cx, r: r, fill: 'none', class: 'donut-track', 'stroke-width': stroke }));
    svg.appendChild(el('circle', {
      cx: cx, cy: cx, r: r, fill: 'none',
      stroke: options.color || 'currentColor',
      'stroke-width': stroke,
      'stroke-dasharray': (c * ratio) + ' ' + c,
      'stroke-linecap': ratio > 0 && ratio < 1 ? 'round' : 'butt',
      transform: 'rotate(-90 ' + cx + ' ' + cx + ')'
    }));
    svg.appendChild(el('text', { x: cx, y: cx + 4, 'text-anchor': 'middle', class: 'donut-value', style: 'font-size:' + Math.round(size / 5) + 'px' }, fmt(score)));
    svg.appendChild(el('text', { x: cx, y: cx + size / 7 + 6, 'text-anchor': 'middle', class: 'donut-caption' }, '/ ' + max));
    return svg;
  }

  /**
   * Horizontal bars.
   * @param {Array<{label:string, value:number|null, delta?:number|null, color?:string}>} rows
   */
  function bars(rows, max, options) {
    options = options || {};
    var wrap = document.createElement('div');
    wrap.className = 'chart-bars';
    rows.forEach(function (row) {
      var line = document.createElement('div');
      line.className = 'bar-row';

      var label = document.createElement('div');
      label.className = 'bar-label';
      label.textContent = row.label;

      var track = document.createElement('div');
      track.className = 'bar-track';
      for (var i = 1; i < max; i++) {
        var tick = document.createElement('span');
        tick.className = 'bar-tick';
        tick.style.left = (i / max) * 100 + '%';
        track.appendChild(tick);
      }
      var fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = row.value === null || row.value === undefined ? '0' : (row.value / max) * 100 + '%';
      var color = row.color || options.color;
      if (color) fill.style.background = color;
      track.appendChild(fill);

      var value = document.createElement('div');
      value.className = 'bar-value';
      value.textContent = options.format ? options.format(row.value) : fmt(row.value);
      if (row.delta !== undefined && row.delta !== null) {
        var d = document.createElement('span');
        d.className = 'delta ' + (row.delta > 0 ? 'up' : row.delta < 0 ? 'down' : 'flat');
        d.textContent = (row.delta > 0 ? '+' : '') + fmt(row.delta);
        value.appendChild(d);

      line.appendChild(label);
      line.appendChild(track);
      line.appendChild(value);
      wrap.appendChild(line);

  }

  /**
   * Gantt timeline (HTML string).
   * rows: [{ label, sub, start, end, category, status }];
   * header: { groups: [{label, span}], labels: [string per month] }.
   */
  function gantt(rows, header, esc) {

    var html = '<div class="gantt-chart" style="--months:' + n + '">' +
      '<div class="gantt-head gantt-years"><div class="gantt-name"></div>' +
      header.groups.map(function (g) { return '<div class="gantt-year" style="grid-column:span ' + g.span + '">' + esc(g.label) + '</div>'; }).join('') + '</div>' +
      '<div class="gantt-head"><div class="gantt-name"></div>' +
      header.labels.map(function (m) { return '<div class="gantt-month">' + esc(m) + '</div>'; }).join('') + '</div>';
    rows.forEach(function (r) {
      html += '<div class="gantt-line cat-' + r.category + ' status-' + r.status + '">' +
        '<div class="gantt-name"><span class="gantt-title">' + esc(r.label) + '</span>' +
        (r.sub ? '<span class="gantt-sub">' + esc(r.sub) + '</span>' : '') + '</div>' +
        '<div class="gantt-track">' +
          '<div class="gantt-bar" style="grid-column:' + r.start + ' / ' + (r.end + 1) + '"></div>' +
        '</div></div>';
    });
    return html + '</div>';
  }

  /**
   * Line chart over periods (SVG).
   * series: [{ label, color, values: [number|null], width?, dashed? }]; xLabels: [string]; max: y maximum.
   */
  function lines(series, xLabels, max, options) {
    options = options || {};
    var W = options.width || 720;
    var H = options.height || 260;
    var padL = 34, padR = 16, padT = 14, padB = 40;
    var n = xLabels.length;
    var plotW = W - padL - padR;
    var plotH = H - padT - padB;
    function x(i) { return padL + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW); }
    function y(v) { return padT + plotH - (v / max) * plotH; }

    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart-lines', role: 'img', 'aria-label': options.label || '' });
    for (var g = 0; g <= max; g++) {
      svg.appendChild(el('line', { x1: padL, x2: W - padR, y1: y(g), y2: y(g), class: 'grid' }));
      svg.appendChild(el('text', { x: padL - 8, y: y(g) + 4, 'text-anchor': 'end', class: 'axis' }, String(g)));
    }
    xLabels.forEach(function (lab, i) {
      svg.appendChild(el('text', { x: x(i), y: H - padB + 18, 'text-anchor': 'middle', class: 'axis' }, lab));

    series.forEach(function (s) {
      var pts = [];
      s.values.forEach(function (v, i) { if (v !== null && v !== undefined) pts.push([x(i), y(v), v]); });
      if (pts.length > 1) {
        svg.appendChild(el('polyline', {
          points: pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' '),
          fill: 'none', stroke: s.color, 'stroke-width': s.width || 2.5,
          'stroke-dasharray': s.dashed ? '6 4' : 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round'
        }));
      }
      pts.forEach(function (p) {
        svg.appendChild(el('circle', { cx: p[0], cy: p[1], r: s.width ? s.width + 1.5 : 4, fill: s.color }));
        if (s.showValues) {
          svg.appendChild(el('text', { x: p[0], y: p[1] - 10, 'text-anchor': 'middle', class: 'point-value', fill: s.color }, fmt(p[2], 2)));
        }
      });
    });
    var wrap = document.createElement('div');
    wrap.className = 'lines-wrap';
    wrap.appendChild(svg);
    var legend = document.createElement('div');
    legend.className = 'chart-legend';
    legend.innerHTML = series.map(function (s) {
      return '<span><i style="background:' + s.color + (s.dashed ? ';opacity:.6' : '') + '"></i>' + String(s.label).replace(/</g, '&lt;') + '</span>';
    }).join('');
    wrap.appendChild(legend);
    return wrap;
  }

  /**
   * Gantt as an HTML table (for printed reports): the year and month header
   * rows repeat at the top of every printed page.
   */
  function ganttTable(rows, header, esc) {
    var n = header.labels.length;
    var html = '<table class="gantt-table"><colgroup><col class="gt-name">';
    for (var c = 0; c < n; c++) html += '<col>';
    html += '</colgroup><thead><tr class="gt-years"><th></th>' +
      header.groups.map(function (g) { return '<th colspan="' + g.span + '">' + esc(g.label) + '</th>'; }).join('') + '</tr>' +
      '<tr class="gt-months"><th></th>' + header.labels.map(function (m) { return '<th>' + esc(m) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr class="cat-' + r.category + ' status-' + r.status + '"><td class="gt-label"><span class="gantt-title">' + esc(r.label) + '</span>' +
        (r.sub ? '<span class="gantt-sub">' + esc(r.sub) + '</span>' : '') + '</td>';
      for (var m = 1; m < r.start; m++) html += '<td></td>';
      html += '<td colspan="' + (r.end - r.start + 1) + '" class="gt-span"><div class="gantt-bar"></div></td>';
      for (var k = r.end + 1; k <= n; k++) html += '<td></td>';
      html += '</tr>';
    });
    return html + '</tbody></table>';
  }

  root.BarometerCharts = { donut: donut, bars: bars, gantt: gantt, ganttTable: ganttTable, lines: lines, fmt: fmt };
})(this);

    var list = Array.prototype.slice.call(files || []);
    var results = [];
    var pending = list.length;
    if (!pending) return;
    list.forEach(function (file, i) {
      var reader = new FileReader();
      reader.onload = function () {
        try { results[i] = { file: file, data: JSON.parse(reader.result) }; }
        catch (e) { results[i] = { file: file, error: e }; }
        if (--pending === 0) done(results);
      };
      reader.readAsText(file);
    });
  };

              '<span class="level-n">' + v + '</span><span class="level-text">' + App.esc(App.L(text)) + '</span></label>';
