# Outil de Diagnostic Organisationnel: server installation.
#
#   1. cp .env.example .env    and change the passwords
#   2. docker compose up -d --build
#   3. open http://<server-address>:8080 and sign in with ADMIN_EMAIL / ADMIN_PASSWORD
#
# HTTPS with a domain name (automatic certificate):
#   set DOMAIN in .env, then   docker compose --profile https up -d --build
#
# See DEPLOY.md for details, backups and restoring.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagnostic
      POSTGRES_USER: diagnostic
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnostic -d diagnostic"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: outil-diagnostic:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://diagnostic:${DB_PASSWORD}@db:5432/diagnostic
      PORT: 8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Facilitateur}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${HTTP_PORT:-8080}:8080"

  # Daily database dump to ./backups (kept BACKUP_KEEP_DAYS days).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: diagnostic
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: diagnostic
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

  # Optional HTTPS front (Let's Encrypt). Needs a domain name pointing to the
  # server and ports 80/443 open. Start with: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
